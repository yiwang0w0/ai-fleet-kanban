/* ── ② Load view (per-line load; carries no lineage) ─────────────────── */
function renderLoad(wrap){
  const day0 = new Date(tlDate + "T00:00:00").getTime();
  const d0 = day0 - 3600_000, d1 = day0 + 25 * 3600_000;
  const P = Date.parse, now2 = Date.now();
  const colKey = (t) => t.kind === "goal" ? "goal" : (t.line || "unassigned");
  const all = tasks.filter((t) => !t.archived_at);

  // Cards relevant to the day (existence intersects the window)
  const endOf = (t) => t.status === "done"
    ? Math.max(P(t.resolved_at || t.updated_at), P(t.created_at) + 60_000)
    : (t.status === "not_started" ? P(t.created_at) + 1 : now2);
  const rows = all.map((t) => ({ t, s: P(t.created_at), e: endOf(t) }))
    .filter((it) => it.s < d1 && it.e > d0);

  // Window choice: fit = densest activity ± (min 4h); day = 26h; object = cluster
  let w0 = d0, w1 = d1;
  if (tlView === "fit"){
    const ev = [];
    for (const it of rows){
      if (it.s >= d0 && it.s < d1) ev.push(it.s);
      if (it.t.status === "done" && it.e >= d0 && it.e < d1) ev.push(it.e);
      for (const sp of (it.t.work_spans || [])){
        const a = P(sp.s), b = sp.e ? P(sp.e) : now2;
        if (a < d1 && b > d0){ ev.push(Math.max(a, d0)); ev.push(Math.min(b, d1)); }
      }
    }
    if (ev.length){
      let lo = Math.min(...ev) - 1800_000, hi = Math.max(...ev) + 1800_000;
      if (hi - lo < 4 * 3600_000){ const mid = (lo + hi) / 2;
        lo = mid - 2 * 3600_000; hi = mid + 2 * 3600_000; }
      w0 = Math.max(d0, lo); w1 = Math.min(d1, hi);
    }
  } else if (tlView !== "day"){ w0 = Math.max(d0, tlView.from); w1 = Math.min(d1, tlView.to); }

  const vis = rows.filter((it) => it.s < w1 && it.e > w0);
  if (!vis.length){ wrap.innerHTML = `<div class="empty">这一窗没有卡</div>`;
    document.getElementById("tl-sum").textContent = ""; return; }
  const lanesFirst = new Map();
  for (const t of all){ const k = colKey(t), v = P(t.created_at);
    if (!lanesFirst.has(k) || v < lanesFirst.get(k)) lanesFirst.set(k, v); }
  const lanesK = [...new Set(vis.map((it) => colKey(it.t)))]
    .sort((a, b) => lanesFirst.get(a) - lanesFirst.get(b));
  // Work spans belong to the line that ACTUALLY worked them (span.w) — moving a
  // card's line never rewrites history. Slot names (mail@2) drop the @k. If a
  // span's line has no row yet, add one (a silently vanished span is a lie).
  const lineOfW = (w2) => String(w2 || "").replace(/@\d+$/, "") || null;
  for (const it of vis)
    for (const sp of (it.t.work_spans || [])){
      const a2 = P(sp.s), b2 = sp.e ? P(sp.e) : now2;
      if (a2 >= w1 || b2 <= w0) continue;
      const k2 = lineOfW(sp.w) || colKey(it.t);
      if (!lanesK.includes(k2)) lanesK.push(k2);
    }

  const spanHours = (w1 - w0) / 3600_000;
  const W = TL.LABW + Math.max(560, Math.round(spanHours * TL.PXH * (tlView === "day" ? 1 : 3))) + 14;
  const plotW = W - TL.LABW - 14;
  const X = (ms) => TL.LABW + (Math.min(Math.max(ms, w0), w1) - w0) / (w1 - w0) * plotW;

  const rowY = new Map(); let cy = TL.AXH + 6;
  for (const k of lanesK){ rowY.set(k, cy); cy += TL.ROWH; }
  const H = cy + 8;
  const colorOf = (k) => k === "goal" ? "#c084fc" : lineColor(k);
  const esc2 = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const NLC = String.fromCharCode(10);

  const rowIn = new Map();
  for (const it of vis) if (it.s < w0) rowIn.set(colKey(it.t), (rowIn.get(colKey(it.t)) || 0) + 1);

  let svg = "";
  // Ticks (dates on day changes — without them 23:00–1:00 reads as two hours)
  const stepH = spanHours > 12 ? 2 : spanHours > 5 ? 1 : 0.5;
  // A day change = "the date differs from the previous tick" (a midnight test dies
  // when epoch-aligned steps never hit local midnight — measured 0 cross-day
  // ticks). The first tick also carries its date = the anchor.
  let prevTickD = "";
  for (let hms = Math.ceil(w0 / (stepH * 3600_000)) * stepH * 3600_000; hms <= w1; hms += stepH * 3600_000){
    const x = X(hms), d = new Date(hms);
    const dk = fmtMD(hms), dayChg = dk !== prevTickD; prevTickD = dk;
    svg += `<line class="tl-tick" x1="${x}" y1="${TL.AXH - 5}" x2="${x}" y2="${H}"${dayChg ? ' stroke-width="2"' : ""}/>`;
    svg += `<text class="tl-ticklab" x="${x + 2}" y="${TL.AXH - 8}">${dayChg ? dk + " " : ""}${String(d.getHours()).padStart(2, "0")}${d.getMinutes() ? ":30" : ""}</text>`;
  }
  // Row names (◀ carried-in count folds into the name) + row bands
  for (const k of lanesK){
    const y = rowY.get(k), c = colorOf(k);
    svg += `<rect class="tl-rowband" x="${TL.LABW - 4}" y="${y - 4}" width="${W - TL.LABW}" height="${TL.ROWH - 6}" fill="${c}" rx="5" opacity="0.05"></rect>`;
    const nm = k === "goal" ? "目标" : k === "unassigned" ? "未指派" : lineLabel(k);
    svg += `<text class="tl-rowlab" x="4" y="${y + 8}" fill="${c}">${esc2(nm)}${rowIn.get(k) ? ` ·◀${rowIn.get(k)}` : ""}</text>`;
  }
  // Per row: waiting-count step band + work segments + start clusters
  let clusterN = 0;
  for (const k of lanesK){
    const y = rowY.get(k) + 8, c = colorOf(k);
    const mine = vis.filter((it) => colKey(it.t) === k);
    // ── Waiting step band (simultaneous waits are not serial → count semantics)
    const waitStarts = mine.filter((it) => it.t.status === "waiting")
      .map((it) => { const sp = it.t.work_spans || [], last = sp[sp.length - 1];
        return Math.max(w0, last && last.e ? P(last.e) : it.s); }).sort((a, b) => a - b);
    if (waitStarts.length){
      let path = "", cnt = 0, px = X(waitStarts[0]);
      const yB = y + 7;
      path = `M ${px} ${yB}`;
      for (const ws of waitStarts){ const x = X(ws); path += ` L ${x} ${yB - cnt * 2} L ${x} ${yB - (cnt + 1) * 2}`; cnt++; }
      path += ` L ${X(w1)} ${yB - cnt * 2} L ${X(w1)} ${yB} Z`;
      svg += `<path class="tl-band" d="${path}" fill="${c}"><title>${esc2(k)}: 等待中 ${cnt} 张(阶梯=进入等待的时刻)</title></path>`;
      svg += `<text class="tl-cont" x="${X(w1) - 16}" y="${yB - cnt * 2 - 2}">${cnt}</text>`;
    }
    // ── Work segments (thick, one lane) — spans go to span.w's row (from vis, not mine)
    for (const it of vis){
      const t = it.t;
      const dim = focusId != null && !relSet.has(t.id);
      for (const sp of (t.work_spans || [])){
        if ((lineOfW(sp.w) || colKey(t)) !== k) continue;
        const a = P(sp.s), b = sp.e ? P(sp.e) : now2;
        if (a >= w1 || b <= w0) continue;
        const x1 = X(a), x2 = Math.max(X(b), x1 + 3);
        svg += `<g class="tl-seg${dim ? " dimmed" : ""}${focusId === t.id ? " sel" : ""}" data-tlid="${t.id}">` +
          `<line class="tl-work" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}"></line>` +
          `<title>#${t.id} ${esc2(t.subject)}${NLC}处理 ${((b - a) / 60000).toFixed(1)} 分 · ${esc2(lineLabel(sp.w))}</title></g>`;
      }
    }
    // ── Start events: neighbors (<10px) cluster into ●N; click = zoom the cluster
    const births = mine.filter((it) => it.s >= w0 && it.s <= w1)
      .sort((a, b) => a.s - b.s);
    let iB = 0;
    while (iB < births.length){
      const x0 = X(births[iB].s); let jB = iB + 1;
      while (jB < births.length && X(births[jB].s) - x0 < 10) jB++;
      const group = births.slice(iB, jB);
      if (group.length === 1){
        const it = group[0], t = it.t, x = X(it.s);
        const dim = focusId != null && !relSet.has(t.id);
        svg += `<g class="tl-seg${dim ? " dimmed" : ""}" data-tlid="${t.id}">` +
          `<circle cx="${x}" cy="${y}" r="3" fill="${c}"${t.status === "not_started" ? "" : ' opacity=".65"'}></circle>` +
          `<title>#${t.id} ${esc2(t.subject)}${NLC}${esc2(t.status)}${t.waiting_for ? "/" + esc2(t.waiting_for) : ""}</title></g>`;
      } else {
        const mid = (group[0].s + group[group.length - 1].s) / 2;
        clusterN++;
        svg += `<g class="tl-cluster" data-from="${group[0].s - 1800_000}" data-to="${group[group.length - 1].s + 1800_000}">` +
          `<circle cx="${X(mid)}" cy="${y}" r="8" fill="${c}"></circle>` +
          `<text x="${X(mid)}" y="${y + 3}" text-anchor="middle">${group.length}</text>` +
          `<title>${group.length} 张卡在此启动: ${group.map((g) => "#" + g.t.id).join(" ")}${NLC}点击放大此段</title></g>`;
      }
      iB = jB;
    }
    // ── Card ids: only when a family is focused, with collision detection
    if (focusId != null){
      let lastEnd = -1e9;
      for (const it of mine){
        if (!relSet.has(it.t.id)) continue;
        const sp = (it.t.work_spans || [])[0];
        const x = X(sp ? P(sp.s) : it.s);
        if (x - lastEnd < 30) continue;
        svg += `<text class="tl-ticklab" x="${x + 4}" y="${y - 6}" fill="${c}">#${it.t.id}</text>`;
        lastEnd = x + 30;
      }
    }
  }
  wrap.innerHTML = `<svg id="tl-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
  const viewLab = tlView === "day" ? "全天 26h" : tlView === "fit" ? "聚焦活动" : "簇放大";
  document.getElementById("tl-sum").textContent =
    `负载 · ${lanesK.length} 条线 · ${vis.length} 张 · ${viewLab} ${fmtRange(w0, w1)}`;
  document.getElementById("tl-note").textContent =
    `粗=处理段 带=等待数量 ●N=同刻启动(点击放大) · 本图只表达负载,谱系见「谱系」`;
}

// (board columns and timeline highlight together)

  else {
    focusId = id;
    try { relSet = new Set((await (await fetch(`/api/tasks/${id}/related`)).json()).ids); }
    catch { relSet = new Set([id]); }
  }
  render(); renderTimeline();
});

function render(){
  if (renderQueued) return;
  renderQueued = true;
  // ⚠⚠ NOT requestAnimationFrame: rAF freezes in background tabs, so the moment the
  //   board goes behind, rendering stops and renderQueued sticks true forever
  //   (measured: the first render ran in background and froze at 0 cards). Boards
  //   are left open — updates must not depend on being watched. Fold with timeout
  //   (fires in background too); rAF is used only for MEASURING below.
  setTimeout(() => { renderQueued = false; renderNow(); }, 0);
}

// ⭐ Folding: the two ever-growing sections — done children and the not-started
//   candidate pool — fold by default; the divider is the switch; state survives
//   refresh (localStorage tb_folds). Folding = those cards skip items and leave via
//   the existing exit animation; opening = next render rebuilds them. Column head
//   counts stay FULL (information is stowed, never lost).
const FOLDS = Object.assign({ donesub: true, cand: true },
  JSON.parse(localStorage.getItem("tb_folds") || "{}"));
function foldHead(divider, foldKey, foldedLabel, openLabel){
  const folded = !!FOLDS[foldKey];
  divider.textContent = folded ? `▸ ${foldedLabel}` : `▾ ${openLabel}`;
  divider.classList.add("fold");
  divider.title = folded ? "点击展开" : "点击收起";
  divider.onclick = () => {
    FOLDS[foldKey] = !FOLDS[foldKey];
    try { localStorage.setItem("tb_folds", JSON.stringify(FOLDS)); } catch {}
    render();
  };
  return folded;
}

function renderNow(){
  const sh = ensureShell();

  // Locating only rearranges the current page — no status writes, no pinned_at.
  // The location survives refresh until Clear or the card leaves the view.
  const locatedTask = locatedId == null ? null : byId.get(locatedId);
  if (locatedId != null && !locatedTask){
    const gone = locatedId;
    locatedId = null; locateScrollPending = false;
    document.getElementById("task-find-clear").disabled = true;
    setFindNote(`#${gone} 已离开当前看板(可能已归档)`, "bad");
  }

  // ── FIRST: note the coordinates before anything moves
  const first = new Map();
  if (!REDUCED.matches)
    for (const [id, el] of cardNodes)
      if (el.isConnected && !el.dataset.leaving) first.set(id, el.getBoundingClientRect());

  const wanted = new Set();

  for (const [key, label] of COLS){
    const { list, n, empty, divider } = sh.get(key);
    const items = [];
    const locatedHere = locatedTask && taskColumn(locatedTask) === key ? locatedTask : null;
    // The located card goes first and leaves its original section — so even a
    // folded pool shows the search result.
    if (locatedHere) items.push(upsert(locatedHere, wanted));
    if (key === "done"){
      const allGoals = tasks.filter((t) => t.kind === "goal" && t.status === "done")
        .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
      const allSubs = pinRelated(tasks.filter((t) => t.kind !== "goal" && t.status === "done")
        .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at))));
      const goals = allGoals.filter((t) => t.id !== locatedId);
      const subs = allSubs.filter((t) => t.id !== locatedId);
      for (const t of pinRelated(goals)) items.push(upsert(t, wanted));
      if (subs.length){
        const folded = foldHead(divider, "donesub",
          `子任务卡 ${allSubs.length} 张(已收起)`, `子任务卡 ${allSubs.length} 张`);
        items.push(divider);
        if (!folded) for (const t of subs) items.push(upsert(t, wanted));
      }
      if (!allGoals.length && !allSubs.length) items.push(empty);
      n.textContent = allGoals.length;
    } else if (key === "not_started"){
      // ⭐ Pile anatomy: segmented claimable → budget-frozen → divider → candidate
      //   pool. The segmentation SHARES claim's criteria (server-sent caps, never
      //   local constants): ① frozen line = lifetime ceiling; ② descendants of
      //   unreleased ancestors → pool; ③ human-gated → pool.
      //   ⚠ The ancestor walk uses the local archived=false view: a broken link
      //   (archived parent) counts as OPEN — this is a DISPLAY grouping; the claim
      //   gate holds the verdict. Better to under-frighten here; the gate stops the
      //   real thing.
      const byId = new Map(tasks.map((x) => [Number(x.id), x]));
      const ancOpen = (t) => {
        let cur = t.parent_id, hops = 0;
        while (cur != null && hops++ < 32) {
          const p = byId.get(Number(cur));
          if (!p) return true;
          if (!p.released) return false;
          cur = p.parent_id;
        }
        return true;
      };
      const lifeCap = (t) => Number(t.max_attempts) * ((meta.caps || {}).lifetime_dispatch || 4);
      const rows0 = pinRelated(rowsFor(key));
      const inQueue = (t) => t.released && !t.human_gate && ancOpen(t);
      const claimableAll = rows0.filter((t) => inQueue(t) && Number(t.attempts) < lifeCap(t));
      const frozenAll = rows0.filter((t) => inQueue(t) && Number(t.attempts) >= lifeCap(t));
      const candAll = rows0.filter((t) => !inQueue(t));
      const claimable = claimableAll.filter((t) => t.id !== locatedId);
      const frozen = frozenAll.filter((t) => t.id !== locatedId);
      const cand = candAll.filter((t) => t.id !== locatedId);
      for (const t of claimable) items.push(upsert(t, wanted));
      for (const t of frozen) items.push(upsert(t, wanted));
      if (candAll.length){
        const folded = foldHead(divider, "cand",
          `队外(未放行/祖先未放行/待人工)${candAll.length} 张(已收起)`,
          `队外(未放行/祖先未放行/待人工)${candAll.length} 张 —— 放行链根/人裁后才进队`);
        items.push(divider);
        if (!folded) for (const t of cand) items.push(upsert(t, wanted));
      }
      if (!rows0.length) items.push(empty);
      n.textContent = candAll.length ? `${claimableAll.length + frozenAll.length}+${candAll.length}` : String(rows0.length);
    } else {
      const allRows = pinRelated(rowsFor(key));
      const rows = allRows.filter((t) => t.id !== locatedId);
      for (const t of rows) items.push(upsert(t, wanted));
      if (!allRows.length) items.push(empty);
      n.textContent = allRows.length;
    }
    placeList(list, items);
  }

  if (locateScrollPending && locatedId != null){
    const target = cardNodes.get(locatedId);
    if (target?.isConnected){
      locateScrollPending = false;
      target.tabIndex = -1;
      requestAnimationFrame(() => {
        target.scrollIntoView({ behavior: REDUCED.matches ? "auto" : "smooth", block:"start", inline:"nearest" });
        target.focus({ preventScroll:true });
      });
    }
  }

  // ── Exit: shrink away, then remove — never blink out
  for (const [id, el] of cardNodes){
    if (wanted.has(id) || !el.isConnected || el.dataset.leaving) continue;
    if (REDUCED.matches){ el.remove(); cardNodes.delete(id); continue; }
    el.dataset.leaving = "1";
    el.style.maxHeight = el.offsetHeight + "px";
    requestAnimationFrame(() => el.classList.add("leaving"));
    setTimeout(() => {
      el.remove();
      if (cardNodes.get(id) === el) cardNodes.delete(id);
    }, 280);
  }

  // ── LAST → INVERT → PLAY
  // Never animate while invisible. A leftover reservation replays with
  // minutes-old coordinates on return (rAF only pauses; it does not cancel).
  if (!REDUCED.matches && !document.hidden) requestAnimationFrame(() => {
    const landed = new Set();
    // ⚠ Measuring with an in-flight transform attached returns the VISUAL position,
    //   not the layout one — the deltas double-cancel and interrupted cards jump.
    //   FIRST may be visual (interruptions continue from there); LAST must be raw
    //   layout — strip right before measuring.
    for (const [, el] of cardNodes){
      if (el.style.transform){ el.style.transition = "none"; el.style.transform = ""; }
    }
    const t = performance.now();
    for (const [id, el] of cardNodes){
      const a = first.get(id);
      if (!a || !el.isConnected || el.dataset.leaving) continue;
      const b = el.getBoundingClientRect();
      // In flight AND the destination unchanged: don't rebuild the animation.
      // SSE lands one beat after actions; naively rebuilding restarts the flight at
      // the 20ms mark every time.
      if (el.__flyUntil > t && el.__flyTo &&
          Math.abs(el.__flyTo.left - b.left) < 1 && Math.abs(el.__flyTo.top - b.top) < 1){
        el.style.transition = el.__flyEase; el.style.transform = "none";   // restore what was stripped
        continue;
      }
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      el.__flyTo = { left: b.left, top: b.top };
      el.__flyUntil = t + 320;
      el.classList.add("flip");
      el.style.transition = "none";
      // Lift slightly before crossing (scale returns to 1 on landing = settles in)
      el.style.transform = `translate(${dx}px, ${dy}px) scale(1.03)`;
      if (Math.abs(dx) > 2) landed.add(el.closest(".col"));   // landing flash only when crossing columns
      el.__flyEase = "transform .3s cubic-bezier(.2,.7,.3,1)";
      requestAnimationFrame(() => {
        el.style.transition = el.__flyEase;
        el.style.transform = "none";
        setTimeout(() => {
          el.classList.remove("flip");
          el.style.transition = ""; el.style.transform = "";
        }, 320);
      });
    }
    for (const col of landed){
      if (!col) continue;
      col.classList.add("landed");
      setTimeout(() => col.classList.remove("landed"), 520);
    }
  });

  for (const el of document.querySelectorAll(".card.enter"))
    setTimeout(() => el.classList.remove("enter"), 300);

  syncGoalPrev();
  renderTimeline();
  tick();                       // fill the running numbers immediately (no 1s blank)
  const c = meta.counts || {};
  set("f-arch", meta.archived_count);
  set("f-up", meta.uptime_sec == null ? "–" : fmtUp(meta.uptime_sec));
  set("f-ns", c.not_started); set("f-ip", c.in_progress); set("f-wa", c.waiting); set("f-dn", c.done);
  // ⭐ The browser TAB is the cheapest notification surface there is. A card
  //   landing in waiting used to be silent unless the sentries were mounted
  //   (measured on a live deployment: delivered cards sat unheard) — the tab
  //   title now carries the waiting count, visible from any other tab.
  document.title = c.waiting > 0 ? `(${c.waiting} 待裁)AI 舰队看板` : "AI 舰队看板";
  document.getElementById("f-when").textContent = "刷新于 " + new Date().toTimeString().slice(0,8);
}
const set = (id, v) => { document.getElementById(id).textContent = v == null ? "–" : v; };
const fmtUp = (s) => s < 3600 ? Math.floor(s/60)+"m" : Math.floor(s/3600)+"h"+Math.floor((s%3600)/60)+"m";

let workers = [], LINES = [], LINE_HINTS = {}, ROUTES = [], claimMisses = [];
/** Worker names of every RUNNING supervised slot (slot 1 = the line name,
 *  slot k = line@k — the server's slotKey, mirrored). */
function liveWorkerNames(){
  const s = new Set();
  for (const w of workers) for (const sl of (w.slots || []))
    if (sl.running) s.add(sl.slot <= 1 ? w.line : `${w.line}@${sl.slot}`);
  return s;
}

function renderRig(){
  if (cfg.classList.contains("show")) return;   // don't redraw while settings are open (sliders vanish mid-drag)
  const rig = document.getElementById("rig");
  rig.innerHTML = `<span class="lbl">自动拉取</span>` + workers.map((w) => {
    const label = lineLabel(w.line);
    const slots = (w.slots || []).filter((sl) => sl.running);
    const xN = slots.length > 1 ? `×${slots.length}` : "";
    // ⭐ The rig does NOT guess a stop reason from the exit code — one code carries
    //   three meanings. Show the structured text the server recorded at the point the
    //   stop was initiated; fall back to the old code wording only for an older server
    //   that does not send stop_text (rolling upgrades).
    const tail = w.running ? (w.last_log?.[w.last_log.length-1] || "")
                           : (w.stop_text || (w.exit_code == null ? "" : `已停止 code=${w.exit_code}`));
    // Extra slots (2+) list their tails as ②③… — melted into one, "how many are
    // running" loses its meaning
    const extra = slots.filter((sl) => sl.slot > 1)
      .map((sl) => `<span class="tail">${"⓪①②③④"[sl.slot] || "#" + sl.slot}${esc(sl.tail || "")}</span>`).join("");
    return `<span class="wk${w.running ? " on" : ""}" title="${esc((w.last_log||[]).join(String.fromCharCode(10)))}">` +
           `<span class="st"></span><span class="nm" style="color:${lineColor(w.line)}" title="${esc(LINE_HINTS[w.line] || "")}">${esc(label)}${xN}</span>` +
           `<span class="tail">${esc(tail)}</span>` + extra +
           `<button class="gear" data-cfg="${w.line}" title="模型 / 强度 / 并行">⚙</button>` +
           `<button data-wk="${w.line}" data-op="${w.running ? "stop" : "start"}">${w.running ? "停止" : "启动"}</button></span>`;
  }).join("")
  // claim_misses onto the face — the API emitted them long before anyone read them
  // (installed ≠ armed). Slot keys (alpha@2) match by root name; a root missing
  // from the supervised set = the prime typo suspect ⇒ named in red.
  + claimMisses.filter((m) => (m.n || 0) >= 3).map((m) => {
      const root = String(m.worker || "").split("@")[0];
      const known = workers.some((w) => w.line === root);
      const mins = m.since ? Math.max(1, Math.round((Date.now() - m.since) / 60000)) : "?";
      return `<span class="wk" title="route=${esc(m.route || "?")} line=${esc(m.line || "?")}">` +
             `<span class="tail"${known ? "" : ' style="color:var(--bad)"'}>⚠${esc(m.worker)} 连续 ${m.n} 次空领` +
             ` (≈${mins} 分)${known ? "" : " · 疑似打错 worker 名"}</span></span>`;
    }).join("");
}

let MODELS = [], EFFORTS = [], RUNTIMES = [], MAXP = 0;  // MAXP=0 ⇒ old server, no parallel
const cfg = document.getElementById("cfg");

/* Settings unit = the Agent (slot): each block is CLI + model + effort + own
   window. The "parallel count" counter is GONE — the number of blocks IS the
   parallelism (never the same fact in two places). Agent1 = persistent session
   (undeletable); Agent2+ = fresh session per card (✕ removable). Add = clone of
   slot 1's config. */
let cfgLine = null, cfgAgents = [], cfgLegacy = false, cfgSingle = false, cfgAnchor = null;
// CAS revision: SAVE WITH THE REV YOU READ — without it, two panels doing
// read-modify-write silently overwrite each other.
let cfgRev = 0;

function openCfg(anchor, line){
  const w = workers.find((x) => x.line === line) || {};
  const st = w.settings || {};
  cfgLine = line;
  cfgSingle = line === "review";
  cfgLegacy = !Array.isArray(st.agents);            // old server ⇒ display only, saving blocked
  cfgAgents = cfgLegacy
    ? [{ runtime: st.runtime || "claude", model: st.model || (MODELS[0] || {}).id || "",
         effort: st.effort || "high", window: !!st.window }]
    : st.agents.map((a) => ({ ...a }));
  cfgRev = Number(st.rev || 0);
  cfgAnchor = anchor;
  renderCfg();
}

function renderCfg(){
  const w = workers.find((x) => x.line === cfgLine) || {};
  const seatModels = (rt) => { const seat = RUNTIMES.find((r2) => r2.id === rt);
    return (seat && seat.models && seat.models.length) ? seat.models : MODELS; };
  // ⭐ Effort domains come from the SEAT's declaration (model > seat > global).
  //   Using the global EFFORTS directly would offer forbidden rungs — and an
  //   offerable choice is a de-facto permission.
  const seatEfforts = (rt, model) => {
    const seat = RUNTIMES.find((r2) => r2.id === rt);
    if (!seat) return EFFORTS;
    const m = (seat.models || []).find((x) => x.id === model);
    return (m && m.efforts) || seat.efforts || EFFORTS;
  };
  const blocks = cfgAgents.map((a, i) => {
    const dom = seatEfforts(a.runtime || "claude", a.model);
    const ei = Math.max(0, dom.indexOf(a.effort));
    return `
    <fieldset class="agent">
      <legend>Agent${i + 1}<span class="sub">${i === 0 ? "持续会话·继承记忆" : "逐卡新会话"}</span>${i > 0 ? `<button class="ax" data-del="${i}" title="删除此 Agent">✕</button>` : ""}</legend>
      <div class="duo">
        <span><div class="cap">CLI</div>
          <select data-i="${i}" data-k="runtime">
            ${(RUNTIMES.length ? RUNTIMES : [{ id: "claude", label: "Claude Code" }]).map((r2) =>
              `<option value="${r2.id}"${(a.runtime || "claude") === r2.id ? " selected" : ""}${r2.disabled ? " disabled" : ""}>${esc(r2.label)}</option>`).join("")}
          </select></span>
        <span><div class="cap">模型名称</div>
          <select data-i="${i}" data-k="model">
            ${seatModels(a.runtime || "claude").map((m) =>
              `<option value="${m.id}"${m.id === a.model ? " selected" : ""}>${esc(m.label)}</option>`).join("")}
          </select></span>
      </div>
      <div class="cap" style="margin-top:7px">强度 <b>${esc(a.effort || "")}</b></div>
      ${dom.length > 1
        ? `<input type="range" min="0" max="${dom.length - 1}" step="1" value="${ei}" data-i="${i}" data-k="effort">
           <div class="ends"><span>${esc(dom[0])}</span><span>${esc(dom[dom.length - 1])}</span></div>`
        // ⭐ Single-rung models show NO slider. A max=0 slider is a decoration that
        //   does nothing when pressed — the worst kind of UI.
        : `<div class="ends"><span>此模型固定单档(座席裁定)</span></div>`}
      <label class="chk" style="margin-top:5px"><input type="checkbox" data-i="${i}" data-k="window"${a.window ? " checked" : ""}> 用独立控制台窗口启动</label>
    </fieldset>`;
  }).join("");
  cfg.innerHTML = `
    <h4 style="color:${lineColor(cfgLine)}">${esc(lineLabel(cfgLine))}</h4>
    ${blocks}
    ${cfgSingle ? `<div class="ends"><span>${esc(cfgLine)} 职务单线 —— 只有一个 Agent</span></div>` : `
    <button id="cfg-add"${cfgAgents.length >= (MAXP || 1) || cfgLegacy ? " disabled" : ""}>＋ 添加一个 Agent</button>
    <div class="ends"><span>${cfgLegacy ? "服务器旧版 —— 重启看板进程后可用" : ""}</span><span>上限 ${MAXP || 3}(全线共享额度)</span></div>`}
    <div class="note" id="cfg-note">${w.running && w.stale_settings ? "当前进程仍用旧设置,停止再启动才生效" : ""}</div>`;
  const r = cfgAnchor.getBoundingClientRect();
  cfg.style.left = Math.min(r.left - 90, innerWidth - 320) + "px";
  cfg.style.top = (r.bottom + 6) + "px";
  cfg.classList.add("show");
}

/** Save = the whole agents[] submitted. On failure, roll back to the server's real
 *  state (no partial success left behind). */
async function saveAgents(){
  const n = document.getElementById("cfg-note");
  if (cfgLegacy){ if (n) n.textContent = "服务器旧版 —— 重启看板进程后可用"; return false; }
  try {
    const r = await post(`/api/workers/${cfgLine}/settings`, { agents: cfgAgents, rev: cfgRev });
    if (n) n.textContent = r.note || "";
    const w = workers.find((x) => x.line === cfgLine); if (w) w.settings = r.settings;
    cfgRev = Number((r.settings || {}).rev || 0);      // next save uses the new revision
    return true;
  } catch (err) {
    // ⭐ 409 (someone else fixed it first) fetches THE REAL STATE before showing —
    //   rolling back to our stale copy would display "their change erased" and the
    //   next save would really erase it.
    const conflict = /rev|已被他处改动/.test(String(err.message || ""));
    if (conflict) {
      try {
        const fresh = await (await fetch("/api/workers")).json();
        const w2 = (fresh.workers || []).find((x) => x.line === cfgLine);
        if (w2 && w2.settings && Array.isArray(w2.settings.agents)) {
          const w0 = workers.find((x) => x.line === cfgLine); if (w0) w0.settings = w2.settings;
          cfgAgents = w2.settings.agents.map((a) => ({ ...a }));
          cfgRev = Number(w2.settings.rev || 0);
        }
      } catch {}
      renderCfg();
      const nc = document.getElementById("cfg-note");
      if (nc) nc.textContent = "另一处面板刚改过这条线 —— 已取回最新设置,请重新调整";
      return false;
    }
    const w = workers.find((x) => x.line === cfgLine);
    if (w && w.settings && Array.isArray(w.settings.agents))
      cfgAgents = w.settings.agents.map((a) => ({ ...a }));
    renderCfg();
    const n2 = document.getElementById("cfg-note");
    if (n2) n2.textContent = "保存失败:" + err.message;
    return false;
  }
}

cfg.addEventListener("input", (e) => {
  const el = e.target.closest("[data-i][data-k]"); if (!el) return;
  const i = Number(el.dataset.i), k = el.dataset.k;
  const a = cfgAgents[i]; if (!a) return;
  const domOf = (ag) => {
    const seat = RUNTIMES.find((r2) => r2.id === (ag.runtime || "claude"));
    if (!seat) return EFFORTS;
    const m = (seat.models || []).find((x) => x.id === ag.model);
    return (m && m.efforts) || seat.efforts || EFFORTS;
  };
  if (k === "effort"){
    a.effort = domOf(a)[Number(el.value)] || a.effort;
    const b = el.closest("fieldset").querySelector(".cap b"); if (b) b.textContent = a.effort;
    saveAgents();
  } else if (k === "window"){ a.window = el.checked; saveAgents(); }
  else if (k === "model"){
    a.model = el.value;
    // A model change changes the effort domain (single-rung models exist); left
    // outside, the save bounces 400.
    const d2 = domOf(a);
    if (!d2.includes(a.effort)) a.effort = d2[d2.length - 1];
    saveAgents().then((okd) => { if (okd) renderCfg(); });
  }
  else if (k === "runtime"){
    a.runtime = el.value;
    // A CLI change swaps the model list to the seat's — if the current model is
    // absent there, snap to the seat's first
    const seat = RUNTIMES.find((r2) => r2.id === el.value);
    const ms = (seat && seat.models && seat.models.length) ? seat.models : MODELS;
    if (!ms.some((m) => m.id === a.model) && ms.length) a.model = ms[0].id;
    const d3 = domOf(a);
    if (!d3.includes(a.effort)) a.effort = d3[d3.length - 1];
    saveAgents().then((okd) => { if (okd) renderCfg(); });
  }
});

cfg.addEventListener("click", (e) => {
  const del = e.target.closest("button[data-del]");
  if (del){
    cfgAgents.splice(Number(del.dataset.del), 1);
    saveAgents().then((okd) => { if (okd) renderCfg(); });
    return;
  }
  const add = e.target.closest("#cfg-add");
  if (add && !add.disabled){
    // Add = clone slot 1 (the expectation is "one more of what I have", not blanks)
    cfgAgents.push({ ...cfgAgents[0] });
    saveAgents().then((okd) => { if (okd) renderCfg(); });
  }
});

// ── [Edit]: fix line / route / self-retry cap ─────────────────────────────────
//   NEVER touches status (state transitions are report/resolve's sole
//   responsibility; touching it here would open a second transition entrance).
//   ⚠ Keys are camelCase: the server pours the body straight into store.update —
//     writing max_attempts destructures to undefined, lands in no SET, and 200
//     returns with ZERO columns changed. No exception, no witness. The `changed`
//     return is therefore ALWAYS read below; 0 = say so on screen.
const epop = document.getElementById("edit");

function openEdit(anchor, taskId){

      </select>
    </div>
    <div class="row">
      <div class="cap">路由</div>
      <select data-eid="${t.id}" data-k="route">
        ${ROUTES.map((r) => `<option value="${r}"${t.route === r ? " selected" : ""}>${esc(r.toUpperCase())}</option>`).join("")}
      </select>
    </div>
    <div class="row">
      <div class="cap">自行尝试上限 <b id="edit-ma">${ma}</b></div>

  epop.classList.add("show");

async function saveEdit(id, k, v){
  const n = document.getElementById("edit-note");
  const body = {}; body[k] = v;
  try{
    const r = await post(`/api/tasks/${id}/update`, body);
    // ⭐ Reading `changed` is this function's point. 200 ≠ saved — a wrong key name
    //   returns 200 with zero columns. "Accepted" and "applied" are shown apart.
    // A notice (today: an in-progress description append is invisible to the running
    // worker) outranks the count — it is the part the writer cannot see for themselves.
    if (n) n.textContent = r.notice ? r.notice
      : r.changed
      ? `已保存(${r.changed} 项)`
      : "服务端接受了请求,但一列都没改动 —— 键名或值可能不对";
    await refresh();
  }catch(err){
    // Show the reason VERBATIM (post() carries the server's `error` in the message).
    //   The main refusals landing here: ① an in-progress card is 409 for EVERY field —
    //   only a pure tail-append to description is allowed through, and this dialog has
    //   no description box, so from here in-progress always means 409; ② the domain gate
    //   is 400 ("unknown route" / "unknown line").
    if (n) n.textContent = "保存失败:" + err.message;
  }
}

epop.addEventListener("input", (e) => {
  const el = e.target.closest("[data-eid]"); if (!el) return;
  const id = el.dataset.eid, k = el.dataset.k;
  if (k === "maxAttempts"){
    document.getElementById("edit-ma").textContent = el.value;
    saveEdit(id, "maxAttempts", Number(el.value));
  } else if (k === "line")  saveEdit(id, "line", el.value || null);
  else if (k === "route")   saveEdit(id, "route", el.value);
});

const pick = document.getElementById("pick");
// Elements that carry their own meaning inside a card — the focus toggle must not
// eat them.
const SELF_ACTING = "button, textarea, select, input, a, [data-ev], [data-pick], [data-cfg], [data-stop]";

let ctxLines = [];
// 1M-window models set the gauge (Haiku 4.5 = 200K). The real window follows the
// worker's model setting — this is a HINT; the measured token number above is what
// counts. The bar exists to spot danger at a glance.
const CTX_LIMITS = { "claude-opus-5":1e6, "claude-sonnet-5":1e6, "claude-fable-5":1e6,
                     "claude-haiku-4-5":2e5 };
const CTX_DEFAULT = 1e6;
const ctxLimitOf = (line) =>
  CTX_LIMITS[(workers.find((w) => w.line === line) || {}).settings?.model] ?? CTX_DEFAULT;
const kfmt = (n) => n == null ? "—"
  : n >= 1e6 ? (n/1e6).toFixed(1) + "M" : n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n);

document.getElementById("ctx").querySelector("h2")
  .addEventListener("click", () => document.getElementById("ctx").classList.toggle("open"));

function renderCtx(){
  const body = document.getElementById("ctx-body");
  const live = ctxLines.filter((c) => c.exists);
  document.getElementById("ctx-sum").textContent =
    live.length ? `${live.length} 条线有会话 · 最大 ${kfmt(Math.max(...live.map((c) => c.tokens || 0)))}` : "还没有会话";
  body.innerHTML = ctxLines.map((c) => {
    if (!c.exists){
      // Memory carrier stated explicitly — "fresh session per card" is a design,
      // not neglect, and the screen says so. (The origin shipped this branch with a
      // brace-less if + const = a SyntaxError that would have killed the whole
      // script; fixed in the port.)
      const anch = c.anchor
        ? `记忆载体=锚点档 ${esc(c.anchor)}` +
          (c.anchor_mtime ? `(${new Date(c.anchor_mtime).toISOString().slice(5, 10)} 更新)` : "")
        : "";
      return `<div class="cl"><span class="nm" style="color:${lineColor(c.line)}">${esc(lineLabel(c.line))}</span>` +
             `<span class="none">${c.no_session ? "每卡新会话 · " + (anch || "无锚点档") : "未开始过会话"}</span><span></span><span></span></div>`;
    }
    const lim = ctxLimitOf(c.line);
    const pct = Math.min(100, Math.round((c.tokens || 0) / lim * 100));
    const cls = pct >= 80 ? "bad" : pct >= 55 ? "warn" : "";
    const lc = c.last_compact
      ? `上次整理 ${kfmt(c.last_compact.pre)}→${kfmt(c.last_compact.post)}`
      : (c.compactions ? "" : "未整理过");
    return `<div class="cl">
      <span class="nm" style="color:${lineColor(c.line)}">${esc(lineLabel(c.line))}</span>
      <span class="bar ${cls}"><i style="width:${pct}%"></i></span>
      <span class="num">${kfmt(c.tokens)} / ${kfmt(lim)} tok · ${c.messages} 条 · ${esc(lc)}</span>
      <button data-ctx="${c.line}">整理上下文</button>
    </div>`;
  }).join("");
}

/** The immutable history, paged to the end. ⚠ Stops only when a page comes back
 *  short; a cursor that fails to advance throws instead of looping forever. */
async function loadTaskEvents(){
  const out = [];
  let after = 0;
  for (;;) {
    const page = await fetch(`/api/task-events?after=${after}&limit=50000`).then((x) => x.json());
    const rows = page.events || [];
    out.push(...rows);
    if (rows.length < 50000) return out;
    const next = Number(page.last_id || 0);
    if (next <= after) throw new Error("task-events 分页没有前进");
    after = next;
  }
}

async function refresh(){
  try{
    const [r, mres, wres, cres, eres, ures, qres, sres] = await Promise.all([
      fetch("/api/tasks?archived=false").then((x) => x.json()),
      fetch("/api/meta").then((x) => x.json()),
      fetch("/api/workers").then((x) => x.json()),
      fetch("/api/context").then((x) => x.json()),
      loadTaskEvents(),
      fetch("/api/usage").then((x) => x.json()).catch(() => ({ cards: {} })),
      fetch("/api/requests?open=1").then((x) => x.json()).catch(() => ({ requests: [] })),
      fetch("/api/setup").then((x) => x.json()).catch(() => null),
    ]);
    renderQuick(qres.requests || []);
    renderGuide(sres);
    renderUpgrade(sres && sres.upgrade);
    set("f-rev", sres?.version || "–");
    ctxLines = cres.lines;
    claimMisses = wres.claim_misses || [];
    workers = wres.workers; LINES = wres.lines; MODELS = wres.models; EFFORTS = wres.efforts;
    LINE_HINTS = wres.line_hints || {}; ROUTES = wres.routes || [];
    RUNTIMES = wres.runtimes || []; MAXP = wres.max_parallel || 0;
    DECOMP = wres.decompose_models || [];
    if (r.server_now) skew = r.server_now - Date.now();
    tasks = r.tasks; taskEvents = eres; usageByCard = (ures && ures.cards) || {};
    meta = { ...mres, archived_count: r.archived_count, caps: r.caps || {} };
    byId.clear(); for (const t of tasks) byId.set(t.id, t);
    render(); renderRig(); renderCtx();
  }catch(e){ live(false, "取数失败"); }
}

function live(on, txt){
  document.getElementById("dot").className = "dot" + (on ? "" : " off");
  document.getElementById("livetxt").textContent = txt;
}

document.addEventListener("click", async (e) => {
  // ── Create goal + decompose
  if (e.target.id === "goal-add"){
    const ta = document.getElementById("goal-in");
    const text = ta.value.trim();
    if (!text) return;
    const btn = e.target; btn.disabled = true; const lab = btn.textContent;
    const [subject, ...rest] = text.split(String.fromCharCode(10));
    try{
      btn.textContent = "建目标…";
      const g = await post("/api/goals", { subject, description: rest.join(String.fromCharCode(10)) , parentId: document.getElementById("goal-prev")?.value || null });
      ta.value = "";
      btn.textContent = "拆解中…";
      const r = await post(`/api/goals/${g.task.id}/decompose`,
                           { model: document.getElementById("goal-model").value });
      await refresh();
      alert(`目标 #${g.task.id} 拆出 ${r.count} 张子任务卡(${r.model})
` + HOLD_HINT);
    }catch(err){ alert("失败:" + err.message); }
    finally{ btn.disabled = false; btn.textContent = lab; }
    return;
  }
  const pin = e.target.closest("button[data-pin]");
  if (pin){
    pin.disabled = true;
    try{ await post(`/api/tasks/${pin.dataset.pin}/pin`, { pinned: pin.dataset.on !== "1" }); }
    catch(err){ alert("置顶失败:" + err.message); }
    finally{ pin.disabled = false; await refresh(); }
    return;
  }

  const dec = e.target.closest("button[data-dec]");
  if (dec){
    dec.disabled = true; const lab = dec.textContent; dec.textContent = "拆解中…";
    try{
      const r = await post(`/api/goals/${dec.dataset.dec}/decompose`,
                           { model: (DECOMP[0] || {}).id });
      await refresh();
      alert(`拆出 ${r.count} 张子任务卡(${r.model})
` + HOLD_HINT);
    }catch(err){ alert("拆解失败:" + err.message); }
    finally{ dec.disabled = false; dec.textContent = lab; }
    return;
  }

  // ── Clicking a card = focus its stream
  const cardEl = e.target.closest(".card[data-id]");
  // ⚠ Everything NOT listed here turns into "card pressed = focus toggle", and
  //   enumerations rot (measured: the line badge got eaten by this branch and
  //   pressing it did nothing, invisibly, for a long time). One rule instead:
  //   self-meaning elements carry data-stop — even when SELF_ACTING forgets them.
  if (cardEl && !e.target.closest(SELF_ACTING)){
    const id = Number(cardEl.dataset.id);
    if (focusId === id){ focusId = null; relSet = new Set(); }
    else {
      focusId = id;
      try{
        const r = await (await fetch(`/api/tasks/${id}/related`)).json();
        relSet = new Set(r.ids);
      }catch{ relSet = new Set([id]); }
    }
    render();
    return;
  }
  if (!cardEl && !e.target.closest(".goalbox") && !e.target.closest("#rig")
      && !e.target.closest("#ctx") && !e.target.closest("#tl") && focusId != null){
    focusId = null; relSet = new Set(); render(); return;
  }

  const badge = e.target.closest("[data-pick]");
  if (badge){ openPick(badge, badge.dataset.pick); return; }

  const as = e.target.closest("button[data-assign]");
  if (as){
    pick.classList.remove("show");
    await post(`/api/tasks/${as.dataset.assign}/update`, { line: as.dataset.line || null });
    await refresh(); return;
  }

  const cx = e.target.closest("button[data-ctx]");
  if (cx){
    const line = cx.dataset.ctx;
    cx.disabled = true; const old = cx.textContent; cx.textContent = "整理中…";
    try{
      const r = await post(`/api/context/${line}/compact`, {});
      alert(`${line} 整理完成
${kfmt(r.before)} → ${kfmt(r.after)} tok

它给自己写的保留指示:
${r.memo}`);
    }catch(err){ alert("整理失败:" + err.message); }
    finally{ cx.disabled = false; cx.textContent = old; await refresh(); }
    return;
  }

  const g = e.target.closest("button[data-cfg]");
  if (g){ openCfg(g, g.dataset.cfg); return; }

  const ed = e.target.closest("button[data-edit]");
  if (ed){ openEdit(ed, ed.dataset.edit); return; }

  const openDecision = e.target.closest("button[data-open-decision]");
  if (openDecision){
    const t = byId.get(Number(openDecision.dataset.openDecision));
    if (t) openDecisionModal(t);
    return;
  }

  // Structured final ruling: option confirmations always hand back to the original
  // agent; "nothing further" is the only real close.
  const decide = e.target.closest("button[data-decide]");
  if (decide){
    const id = Number(decide.dataset.decide), t = byId.get(id);
    const key = decisionChoice.get(id);
    const opt = t?.decision_package?.options?.find((o) => o.key === key);
    if (!opt) return;
    const incompleteApply = opt.kind === "apply" && !opt.ready;
    const executedApply = opt.kind === "apply" && opt.ready;
    const outcome = outcomeDraft.get(id) ||
      document.querySelector(`[data-handoff-outcome="${id}"]:checked`)?.value || "";
    const receipt = (document.querySelector(`textarea[data-handoff-receipt="${id}"]`)?.value || "").trim();
    if (executedApply && !outcome){
      alert("请先选择执行结果:成功或失败。");
      return;
    }
    if (executedApply && !receipt){
      alert("请先填写执行回执,再交回 Agent。");
      return;
    }
    if (decide.dataset.armed !== "1"){
      decide.dataset.armed = "1"; decide.dataset.orig = decide.textContent;
      decide.classList.add("armed");
      armSwap(decide, incompleteApply
        ? `再按=交回 Agent 补齐 ${opt.key}`
        : executedApply && outcome === "failure" ? `再按=确认 ${opt.key} 执行失败并退回修正`
        : executedApply ? `再按=确认 ${opt.key} 执行成功并附回执` : `再按=采用 ${opt.key}`);
      setTimeout(() => { if (decide.dataset.armed === "1"){
        decide.dataset.armed = ""; decide.classList.remove("armed"); decide.style.width = "";
        syncDecision(decide.closest("[data-decision-scope]") || decide.closest(".card"), t);
      } }, 4000);
      return;
    }
    decide.dataset.armed = ""; decide.classList.remove("armed"); decide.style.width = ""; decide.disabled = true;
    const extra = (document.querySelector(`textarea[data-vin="${id}"]`)?.value || "").trim();
    try{
      await post(`/api/tasks/${id}/resolve`, { verdict:"approve", resolved_by:"human",
        selected_option:opt.key,
        decision_action:incompleteApply ? "request_completion" : executedApply ? "confirm_executed" : "continue",
        executed:executedApply, outcome:executedApply ? outcome : undefined,
        receipt:executedApply ? receipt : undefined,
        note:extra });
      verdictDraft.delete(id); decisionChoice.delete(id); receiptDraft.delete(id); outcomeDraft.delete(id);
      closeDecisionModal(); await refresh();
    }catch(err){ alert("裁定失败:" + err.message); decide.disabled = false;
      syncDecision(decide.closest("[data-decision-scope]") || decide.closest(".card"), t); }
    return;
  }

  const finalClose = e.target.closest("button[data-final-close]");
  if (finalClose){
    const id = Number(finalClose.dataset.finalClose);
    if (finalClose.dataset.armed !== "1"){
      finalClose.dataset.armed = "1"; finalClose.dataset.orig = finalClose.textContent;
      finalClose.classList.add("armed"); armSwap(finalClose, "再按=确认无需后续");
      setTimeout(() => { if (finalClose.dataset.armed === "1"){
        finalClose.dataset.armed = ""; finalClose.classList.remove("armed");
        disarmRestore(finalClose);
        if (!finalClose.dataset.orig) finalClose.textContent = "无需后续 · 结案";
      } }, 4000);
      return;
    }
    finalClose.dataset.armed = ""; finalClose.classList.remove("armed"); disarmRestore(finalClose); finalClose.disabled = true;
    try{
      await post(`/api/tasks/${id}/resolve`, { verdict:"approve", note:"", resolved_by:"human" });
      verdictDraft.delete(id); decisionChoice.delete(id); receiptDraft.delete(id); outcomeDraft.delete(id);
      closeDecisionModal(); await refresh();
    }catch(err){ alert("结案失败:" + err.message); finalClose.disabled = false; }
    return;
  }

  const wk = e.target.closest("button[data-wk]");
  if (wk){
    wk.disabled = true;
    try {
      const r = await post(`/api/workers/${wk.dataset.wk}/${wk.dataset.op}`, {});
      // "The process was not running" is not a failure. Silently succeeding looks
      // like nothing happened — say WHAT happened (this path once threw 409 lies).
      if (r && r.already_idle)
        alert(`${wk.dataset.wk}: ${r.note}` + (r.released && r.released.length ? `
在途 ${r.released.join(",")} 已收回未开始。` : ""));
    }
    catch(err){ alert("worker 操作失败:" + err.message); }
    setTimeout(refresh, 400); return;
  }

  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  // ⭐ Two-press confirmation (close is final; archive mis-presses easily and the
  //   two buttons are neighbors). First press = arm (color + caption change; 4s
  //   without a second press disarms). No confirm() dialogs — dialogs train
  //   "confirm" into a reflex; the armed state at least demands a conscious second
  //   press, and disarming is the default direction (not pressing = nothing).
  if ((a === "approve" || a === "archive") && b.dataset.armed !== "1") {
    b.dataset.armed = "1";
    b.dataset.orig = b.textContent;
    b.classList.add("armed");
    const hasNote = ((document.querySelector(`textarea[data-vin="${id}"]`) || {}).value || "").trim();
    armSwap(b, a === "archive" ? "再按=确认归档"
              : hasNote ? "再按=交回原 Agent" : "再按=确认结案");
    setTimeout(() => { if (b.dataset.armed === "1") {
      b.dataset.armed = ""; b.classList.remove("armed");
      disarmRestore(b);
    } }, 4000);
    return;
  }
  b.dataset.armed = ""; b.classList.remove("armed");
  disarmRestore(b);
  b.disabled = true;
  try{
    if (a === "approve" || a === "reject"){
      const ta = document.querySelector(`textarea[data-vin="${id}"]`);
      const note = (ta?.value || "").trim();
      await post(`/api/tasks/${id}/resolve`, { verdict: a, note, resolved_by: "human" });
      verdictDraft.delete(Number(id));
    }
    // ⚠ These two are UNREACHABLE from the UI (no data-a="release"/"hold" keys exist
    //   in this file — release moved to the CLI when execution rights were
    //   consolidated). ⭐ Deliberately kept: the dispatcher is generic data-a → POST
    //   (removing them shortens nothing), and if the ruling changes someday the
    //   road is ready. Kept SILENTLY they mislead the next grep into "the UI has
    //   release" — hence this note.
    else if (a === "release") await post(`/api/tasks/${id}/release`, { released: true });
    else if (a === "hold")    await post(`/api/tasks/${id}/release`, { released: false });
    else if (a === "archive") await post(`/api/tasks/${id}/archive`, {});
    await refresh();
  }catch(err){ alert("操作失败:" + err.message); }
  finally{ b.disabled = false; }
});
async function post(url, body){
  const r = await fetch(url, { method:"POST", headers: WH,
                               body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
  return r.json();
}

// v0.6: the setup guide. Every step's state is MEASURED by the server on each
// refresh, so this walks backward as readily as forward — delete the config or
// break the bless and the guide reopens at that step. Only the FIRST unfinished
// step is expanded: "what do I do now" must have exactly one answer.
// v0.8: the upgrade banner. `git pull` changes files; three live things keep
// running the old ones (the gate's record, this server, the sentries) and none
// of them says so. The board measures all three and lists only what is left.
function renderUpgrade(up){
  const el = document.getElementById("upg");
  if (!el) return;
  if (!up || !up.pending || !(up.steps || []).length){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  const MARK = { done: "✓", todo: "▸", blocked: "·", unknown: "?" };
  const head = up.running && up.on_disk && up.running !== up.on_disk
    ? `⬆ 代码更新了 —— 跑着的是 ${esc(up.running)},磁盘上已经是 ${esc(up.on_disk)}。三步生效:`
    : `⬆ 有东西还在跑旧代码:`;
  el.innerHTML = `<div class="uh">${head}</div>` + up.steps.map((s) => `
    <div class="us ${s.state === "done" ? "done" : ""}">
      <span>${MARK[s.state] || "·"}</span>
      <div><b>${esc(s.title)}</b>${s.detail ? ` <span class="de">— ${esc(s.detail)}</span>` : ""}
        ${s.state !== "done" && s.hint ? `<div class="hi">${esc(s.hint)}</div>` : ""}
        ${s.state !== "done" && s.action?.type === "cmd"
          ? `<div class="act"><code>${esc(s.action.text)}</code><button data-guide-copy="${esc(s.action.text)}">复制</button></div>` : ""}
      </div></div>`).join("");
}
document.getElementById("upg").addEventListener("click", async (e) => {
  const copy = e.target.closest("[data-guide-copy]");
  if (!copy) return;
  try { await navigator.clipboard.writeText(copy.dataset.guideCopy); copy.textContent = "已复制"; }
  catch { copy.textContent = "复制失败,手动选中"; }
});

let guideOpen = null;   // null = follow completeness; true/false = the operator's choice
function renderGuide(su){
  const el = document.getElementById("guide");
  if (!el || !su || !su.steps) return;
  el.hidden = false;
  const open = guideOpen === null ? !su.complete : guideOpen;
  const MARK = { done: "✓", todo: "▸", blocked: "·", unknown: "?" };
  const firstOpen = su.steps.find((s) => s.state !== "done");
  const head = su.complete
    ? `<b>配置完成 ✓</b><span class="gp">${su.done}/${su.total} —— 板已经可以正常用了</span>`
    : `<b>上手引导</b><span class="gp">${su.done}/${su.total} 完成 · 下一步:${esc(firstOpen ? firstOpen.title : "")}</span>`;
  const body = !open ? "" : `<div class="gsteps">` + su.steps.map((s) => {
    const isNow = firstOpen && s.key === firstOpen.key;
    const cls = s.state === "done" ? "done" : isNow ? "now" : s.state === "blocked" ? "blocked" : "";
    let act = "";
    if (isNow && s.action){
      const a = s.action;
      if (a.type === "api")
        act = `<button class="pri" data-guide-api="${esc(a.path)}">${esc(a.label || "执行")}</button>`;
      else if (a.type === "quick")
        act = `<button data-guide-quick="${esc(a.kind)}">${esc(a.label || "交给协调席")}</button>`;
      else if (a.type === "focus")
        act = `<button data-guide-focus="${esc(a.target)}">${esc(a.label || "带我去")}</button>`;
      else if (a.type === "cmd")
        act = `<code>${esc(a.text)}</code><button data-guide-copy="${esc(a.text)}">复制</button>`;
    }
    // ⭐ bless is deliberately NOT a button: a one-click accept would make the
    //    source gate accept code nobody looked at, which is the one thing it
    //    exists to prevent. Say so, right where the button would have been.
    const why = (isNow && s.key === "bless")
      ? `<div class="why">这一步没有一键按钮:验收=你说「这棵树我看过、我接受」。按钮替你点头,闸就白设了。</div>` : "";
    return `<div class="gs ${cls}">
      <span class="mk">${MARK[s.state] || "·"}</span>
      <div><span class="ti">${esc(s.title)}</span>${s.detail ? ` <span class="de">— ${esc(s.detail)}</span>` : ""}
        ${isNow && s.hint ? `<div class="hi">${esc(s.hint)}</div>` : ""}
        ${act ? `<div class="act">${act}</div>` : ""}${why}</div></div>`;
  }).join("") + `</div>`;
  el.innerHTML = `<div class="gh" id="guide-head">${head}<span class="gp" style="margin-left:auto">${open ? "收起" : "展开"}</span></div>${body}`;
}
document.getElementById("guide").addEventListener("click", async (e) => {
  const head = e.target.closest("#guide-head");
  if (head){ guideOpen = !(document.querySelector("#guide .gsteps")); await refresh(); return; }
  const api = e.target.closest("[data-guide-api]");
  const quick = e.target.closest("[data-guide-quick]");
  const focus = e.target.closest("[data-guide-focus]");
  const copy = e.target.closest("[data-guide-copy]");
  try {
    if (api){ api.disabled = true; await post(api.dataset.guideApi, {}); await refresh(); }
    else if (quick){ quick.disabled = true; await post("/api/requests", { kind: quick.dataset.guideQuick, params: { days: 14, authorized: true } }); await refresh(); }
    else if (focus){
      const t = document.getElementById(focus.dataset.guideFocus) || document.getElementById("rig");
      t?.scrollIntoView({ behavior: "smooth", block: "center" });
      t?.animate?.([{ outline: "2px solid var(--ok)" }, { outline: "2px solid transparent" }], { duration: 1600 });
    }
    else if (copy){
      try { await navigator.clipboard.writeText(copy.dataset.guideCopy); copy.textContent = "已复制"; }
      catch { copy.textContent = "复制失败,手动选中"; }
    }
  } catch (err) { alert("这一步没能完成:" + err.message); await refresh(); }
});

// v0.5: shortcut requests. Kinds are the server's closed domain; the seat
// executes them (coordinator-seat skill) and closes the loop with ack/done.
const QUICK_LABEL = { "propose-lines": "起草线路", "mount-sentries": "挂哨",
  "install-worker-constraints": "装工作仓约束", "enable-review": "开自动审阅", "board-briefing": "板上现状" };
function renderQuick(list){
  const el = document.getElementById("quick-list");
  if (!el) return;
  const now = Date.now();
  el.innerHTML = (list || []).map((r) => {
    const ageMin = Math.floor((now - Date.parse(r.created_at)) / 60000);
    // ⭐ Pending too long is the ALARM: silence is not health. Five minutes is
    //   longer than any sentry wake-up and shorter than "I forgot about it".
    const late = r.status === "pending" && ageMin >= 5;
    const st = r.status === "pending" ? (late ? `等了 ${ageMin} 分无人应答 —— 协调席的哨挂着吗?` : "已发出,等协调席响应")
             : `协调席已接手${r.acked_at ? "(" + ago(Date.parse(r.acked_at)) + ")" : ""}`;   // ago() takes epoch ms (measured: NaNhNaNm 前)
    return `<div class="rq${late ? " late" : ""}${r.status === "acked" ? " acked" : ""}">#${r.id} ${esc(QUICK_LABEL[r.kind] || r.kind)}${r.params?.days ? "(近 " + esc(String(r.params.days)) + " 天)" : ""} · ${st}</div>`;
  }).join("");
}
document.getElementById("quick").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-quick]");
  if (!b) return;
  const kind = b.dataset.quick;
  const params = kind === "propose-lines" ? { days: Number(document.getElementById("quick-days").value) || 14, authorized: true } : {};
  const note = document.getElementById("quick-note");
  b.disabled = true;
  try {
    const r = await post("/api/requests", { kind, params });
    note.textContent = `已发出 #${r.request.id} —— 协调席的哨会收到,接手后这里会变`;
    await refresh();
  } catch (err) {
    note.textContent = "发送失败:" + err.message;
  } finally { b.disabled = false; }
});

// v0.4: add a line from the panel. The server validates, persists to the
// config file and rebuilds its registry; the rig picks the new line up on the
// next refresh (it reads /api/workers.lines every time — nothing is cached).
document.getElementById("line-add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const idEl = document.getElementById("line-add-id");
  const hintEl = document.getElementById("line-add-hint");
  const note = document.getElementById("line-add-note");
  const id = idEl.value.trim(), hint = hintEl.value.trim();
  if (!id) return;
  note.className = "note";
  note.textContent = "写入中…";
  try {
    const r = await post("/api/config/lines", { id, hint });
    note.className = "note ok";
    note.textContent = `已加入线「${r.line.id}」—— 配置已写盘,自动拉取行可直接启动`;
    idEl.value = ""; hintEl.value = "";
    await refresh();
  } catch (err) {
    note.className = "note bad";
    note.textContent = "加线失败:" + err.message;
  }
});

// SSE: pushed on change only; heartbeat/lease countdowns are computed locally
// (1s redraw, zero server load)
const es = new EventSource("/api/events");
es.onopen = () => live(true, "实时");
es.onerror = () => live(false, "断线重连中");
// ⭐ Event kinds are NOT enumerated here. Enumerated, every kind the server adds
//   later silently stops arriving (measured: 8 of 16 subscribed). The server sends
//   everything as `change`; the kind rides in data.type.
es.addEventListener("change", refresh);
// Worker stdout arrives per line; refreshing on all of it thrashes — throttle.
let lastLogAt = 0;
es.addEventListener("log", () => {
  const t = Date.now();
  if (t - lastLogAt < 1000) return;
  lastLogAt = t; refresh();
});

refresh();
setInterval(tick, 1000);        // running numbers update in place (no full redraw = open state survives)
setInterval(refresh, 15000);    // fallback poll: a dead SSE never leaves a stale screen
</script>
