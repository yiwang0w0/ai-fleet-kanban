<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AI 舰队看板</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#8b93a3; --dim2:#5d6472;
    --cc:#5b9dff; --l0:#c084fc;
    --ok:#3ecf8e; --warn:#e8b93a; --bad:#f2555a; --wait:#e8b93a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
           --fg:#1a1d23; --dim:#666e7d; --dim2:#98a0ae; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 "Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px}
  .live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.off{background:var(--bad)}

  .task-find{display:flex;align-items:center;gap:7px;padding:8px 16px;border-bottom:1px solid var(--line);
             background:var(--panel)}
  .task-find label{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .task-find input{width:180px;max-width:42vw;background:var(--panel2);color:var(--fg);
                   border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:12px inherit}
  .task-find input:focus{outline:none;border-color:var(--cc);box-shadow:0 0 0 2px color-mix(in srgb,var(--cc) 18%,transparent)}
  .task-find .note{color:var(--dim);font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task-find .note.ok{color:var(--ok)}
  .task-find .note.bad{color:var(--bad)}
  @media (max-width:620px){
    .task-find{flex-wrap:wrap}
    .task-find input{width:min(190px,55vw);max-width:none}
    .task-find .note{flex-basis:100%}
  }

  /* ⚠ 1fr = minmax(auto,1fr): the `auto` means "never narrower than content", so one
     long card title inflates its column and crushes the others (measured: 247px →
     542px). minmax(0,1fr) removes the floor — NO column can inflate from content.
     Chasing individual elements with min-width:0 is whack-a-mole; seal the container. */
  .cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 16px 60px;align-items:start}
  @media (max-width:1400px){ .cols{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:1100px){ .cols{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:620px){ .cols{grid-template-columns:minmax(0,1fr)} }

  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:120px}
  .col > h2{margin:0;padding:9px 12px;font-size:12px;font-weight:600;
            border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .col > h2 .n{color:var(--dim);font-weight:400}
  .col[data-s="goal"] > h2{box-shadow:inset 3px 0 0 var(--l0)}
  .col[data-s="not_started"] > h2{box-shadow:inset 3px 0 0 var(--dim2)}
  .col[data-s="in_progress"] > h2{box-shadow:inset 3px 0 0 var(--cc)}
  .col[data-s="waiting"]     > h2{box-shadow:inset 3px 0 0 var(--wait)}
  .col[data-s="done"]        > h2{box-shadow:inset 3px 0 0 var(--ok)}
  .list{padding:8px;display:flex;flex-direction:column;gap:7px}
  .empty{color:var(--dim2);padding:14px 12px;font-size:12px}

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;
        transition:border-color .12s,box-shadow .12s}
  .card.rel{border-width:2px;border-color:var(--cc);box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 30%,transparent)}

  /* ── Card movement (FLIP) ─────────────────────────────────────────────
     ⭐ Animation starts ONLY after the server confirmed the state. render() is only
     called from refresh() (= after a fresh GET), so "the show finished but the DB
     never changed" is structurally impossible. Nothing moves optimistically. */
  .card.flip{position:relative;z-index:6;box-shadow:0 12px 28px rgba(0,0,0,.45);will-change:transform}
  .card.enter{animation:cardIn .28s cubic-bezier(.2,.7,.3,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(-7px) scale(.96)}to{opacity:1;transform:none}}
  .card.leaving{pointer-events:none;overflow:hidden;opacity:0;transform:scale(.94);
    max-height:0!important;margin-top:-7px;padding-top:0;padding-bottom:0;border-width:0;
    transition:opacity .2s ease,transform .2s ease,max-height .22s ease,margin .22s ease,
               padding .22s ease,border-width .22s ease}
  /* Flash the landing column so the eye can follow where it went */
  .col.landed > h2{background:color-mix(in srgb,var(--cc) 20%,transparent)}
  .col > h2{transition:background .45s ease}
  @media (prefers-reduced-motion: reduce){
    .card.flip,.card.enter,.card.leaving{animation:none!important;transition:none!important}
    .card.flip{transform:none!important;box-shadow:none}
    .col > h2,.col.landed > h2{transition:none}
  }
  .card.self{border-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
  .card.located{border-color:var(--l0);box-shadow:0 0 0 2px color-mix(in srgb,var(--l0) 40%,transparent),
                0 10px 24px color-mix(in srgb,var(--l0) 14%,transparent)}
  .goalbox{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .goalbox textarea{width:100%;min-height:52px;resize:vertical;background:var(--panel2);color:var(--fg);
                    border:1px solid var(--line);border-radius:7px;padding:6px 7px;font:12px inherit}
  .goalbox .rowb{display:flex;gap:6px;align-items:center}
  .goalbox select{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
                  border-radius:7px;padding:4px 6px;font:11px inherit}
  .kids{margin-top:6px;color:var(--dim);font-size:10.5px}
  .subs{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);
        display:flex;flex-direction:column;gap:4px}
  .subs .h{color:var(--dim);font-size:10.5px}
  .sub{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
  .sub .sid{font:600 10px/1 ui-monospace,Consolas,monospace;color:var(--dim)}
  .sub .stt{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);
            white-space:nowrap;color:var(--dim)}
  .sub .stt.in_progress{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 45%,transparent)}
  .sub .stt.waiting{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .sub .stt.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  /* ⚠ min-width:0 is required: a flex item's default is min-width:auto = never
     narrower than content — the ellipsis never fires and a long child title widens
     the whole column (measured). */
  .sub .sj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .divider{display:flex;align-items:center;gap:8px;color:var(--dim2);font-size:10.5px;margin:4px 2px 0}
  .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
  /* ⭐ Fold switch: the divider doubles as the section toggle; hover brightens. */
  .tag.oneof{background:#2b2a4a;color:#b9b6ff;border-color:#3d3a6b}
  .tag.casc{background:#22333f;color:#8fd0e8;border-color:#2f4a5a}
  .divider.fold{cursor:pointer;user-select:none}
  .divider.fold:hover{color:var(--dim)}
  .card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .id{font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--dim)}
  .subj{margin:5px 0 0;font-size:12.5px;word-break:break-word}
  .meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
        color:var(--dim);font-size:11px}
  .tag{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);
       line-height:1.5;white-space:nowrap}
  .tag.hold{color:var(--dim2)}
  .tag.lineage{color:var(--dim);border-style:dashed}
  .tok{color:var(--dim);font-variant-numeric:tabular-nums}
  .tok small{opacity:.75;margin-left:2px}
  .tag.lock{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .tag.wf{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .tag.wf.dep{color:var(--dim)}
  /* confirm = auto-review looked and passed it to a human; louder than untouched review. */
  .tag.wf.confirm{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);font-weight:600}
  .tag.wf.decision{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
  .tag.auto{color:var(--l0);border-color:color-mix(in srgb,var(--l0) 45%,transparent)}
  .tag.manual{color:var(--dim)}
  /* The moment text is typed, the look changes. Knowing BEFORE pressing is the point. */
  button.handoff{border-color:var(--dim);color:var(--fg)}
  .hoh{margin-top:4px;font-size:10.5px;color:var(--warn);min-height:0}
  .tag.tocoord{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
  .tag.pinned{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .line-badge{font-size:10px;padding:1px 5px;border-radius:4px;color:#0b0d11;font-weight:600}
  .hb{font-variant-numeric:tabular-nums}
  .hb.fresh{color:var(--ok)} .hb.stale{color:var(--warn)} .hb.dead{color:var(--bad);font-weight:600}
  .att{font-variant-numeric:tabular-nums}
  .att.hot{color:var(--warn)}
  .ev{margin-top:6px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);
      border-radius:6px;cursor:pointer;user-select:none}
  .ev:hover{border-color:var(--cc)}
  .ev .evh{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:10.5px;
           margin-bottom:3px}
  .ev .evh .hint{color:var(--dim2)}
  .ev .evp{font-size:11px;line-height:1.45;color:var(--fg);opacity:.85;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .decision{margin-top:9px;border:1px solid color-mix(in srgb,var(--wait) 55%,var(--line));
            border-radius:9px;background:color-mix(in srgb,var(--wait) 5%,var(--bg));overflow:hidden}
  .decision-h{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .decision-h b{font-size:12px}.decision-h .rec{margin-left:auto;color:var(--ok);font-size:10.5px}
  .decision-summary{padding:10px 11px;font-size:12px;line-height:1.65;white-space:pre-wrap}
  .decision-options{padding:0 9px 9px;display:grid;gap:7px}
  .dopt{display:block;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;
        background:var(--panel2);transition:border-color .12s,background .12s}
  .dopt:hover{border-color:var(--cc)}
  .dopt.chosen{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--panel2))}
  .dopt.recommended{box-shadow:inset 3px 0 0 var(--ok)}
  .dopt.unready{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));
                background:color-mix(in srgb,var(--bad) 4%,var(--panel2))}
  .dopt-head{display:flex;align-items:flex-start;gap:7px;font-size:12px;font-weight:600}
  .dopt-head input{margin:2px 0 0}.dopt-head .key{color:var(--cc);font:700 12px ui-monospace,Consolas,monospace}
  .dopt-head .flag{margin-left:auto;color:var(--ok);font-size:10px;white-space:nowrap}
  .dopt-detail{margin:6px 0 0 22px;color:var(--fg);font-size:11.5px;line-height:1.55}
  .dopt-cost{margin:5px 0 0 22px;color:var(--warn);font-size:10.8px;line-height:1.5}
  .hf-files{margin:7px 0 0 22px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .hf-files a{color:var(--cc);text-decoration:none;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--line));
               border-radius:6px;padding:3px 7px;font-size:10.5px;background:var(--bg)}
  .hf-files a:hover{background:var(--line)}
  .hf-dir{opacity:.55;font-weight:400}
  .hf-companion{display:inline-flex;align-items:center;gap:6px;border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));
                 border-radius:6px;padding:3px 7px;font-size:10.5px;background:color-mix(in srgb,var(--warn) 5%,var(--bg))}
  .hf-companion b{color:var(--warn);font-weight:600}
  .hf-companion a{border:0;padding:0;background:transparent;text-decoration:underline;text-underline-offset:2px}
  .hf-companion a:hover{background:transparent;color:var(--fg)}
  .hf-warn{margin:6px 0 0 22px;color:var(--bad);font-size:10.5px}
  .hf-receipt{margin-top:9px;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--line));
               border-radius:8px;padding:9px 10px;background:color-mix(in srgb,var(--cc) 4%,var(--panel2))}
  .hf-receipt label{display:block;font-size:11.5px;font-weight:600;margin-bottom:6px;color:var(--cc)}
  .hf-outcome-title{font-size:11.5px;font-weight:600;margin-bottom:6px;color:var(--cc)}
  .hf-outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}
  .hf-outcomes label{display:flex;align-items:flex-start;gap:7px;margin:0;padding:7px 8px;border:1px solid var(--line);
                      border-radius:7px;color:var(--fg);font-size:11px;font-weight:500;cursor:pointer}
  .hf-outcomes label:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--panel2))}
  .hf-outcomes label.failure:has(input:checked){border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel2))}
  .hf-outcomes input{margin:2px 0 0;flex:0 0 auto}
  .hf-outcomes small{display:block;margin-top:2px;color:var(--dim);font-size:10px;font-weight:400}
  .hf-receipt textarea{width:100%;box-sizing:border-box;resize:vertical}
  .hf-receipt .hint{margin-top:5px;color:var(--dim);font-size:10.5px;line-height:1.5}
  .decision-foot{padding:0 11px 10px;color:var(--dim);font-size:10.5px;line-height:1.5}
  .decision-actions{padding-top:2px}
  .decision.compact .decision-summary{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .decision.compact .decision-open{margin:0 10px 10px;width:calc(100% - 20px);color:var(--cc);border-color:var(--cc)}
  #decision-modal .box{width:min(1060px,100%)}
  #decision-modal .bd{font:13px/1.55 inherit;white-space:normal;padding:14px;overflow:auto}
  #decision-modal .decision{margin-top:0}
  button:disabled{cursor:not-allowed;opacity:.45}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;
         align-items:center;justify-content:center;padding:32px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
              width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;
              box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .modal .hd h3{margin:0;font-size:13px;font-weight:600}
  .modal .hd .sp{margin-left:auto;display:flex;gap:6px}
  .modal .bd{padding:14px 16px;overflow:auto;white-space:pre-wrap;word-break:break-word;
             font:13.5px/1.75 ui-monospace,Consolas,monospace}
  .vin{width:100%;min-height:46px;resize:vertical;margin-top:7px;background:var(--bg);color:var(--fg);
       border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:11.5px/1.5 inherit}
  .vin:focus{outline:none;border-color:var(--cc)}
  .acts{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  button{font:11px/1 inherit;padding:5px 9px;border-radius:6px;cursor:pointer;
         border:1px solid var(--line);background:transparent;color:var(--fg)}
  button:hover{background:var(--line)}
  button.pri{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok)}
  /* Two-press buttons RESERVE their armed width at rest (em-sized to the longest
     armed caption), so arming changes color and words but never geometry — a
     deployment reported the arm-time growth itself as the defect, not only the
     second press missing. armSwap() still pins as a backstop for odd fonts. */
  button[data-a="approve"]{min-width:9.5em}
  button[data-a="archive"]{min-width:7.5em}
  button[data-final-close]{min-width:9.5em}
  button[data-decide]{min-width:14em}
  /* Upgrade banner: `git pull` changes files, not the running process. This is
     the board telling you what is still running old code, and what to do. */
  .upg{margin:8px 14px 0;border:1px solid var(--warn);border-radius:8px;
       background:color-mix(in srgb,var(--warn) 8%,var(--panel));font-size:12.5px}
  .upg .uh{padding:8px 12px;font-weight:600}
  .upg .us{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:4px 12px;align-items:start}
  .upg .us.done{color:var(--dim)}
  .upg .us:last-child{padding-bottom:10px}
  .upg .de{color:var(--dim)} .upg .hi{margin-top:2px}
  .upg .act{margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .upg code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;
            font:12px ui-monospace,Consolas,monospace;user-select:all}
  /* Setup guide: the first thing a new operator sees, and it disappears into a
     single line once the deployment measures complete. */
  .guide{margin:8px 14px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12.5px}
  .guide .gh{display:flex;gap:8px;align-items:center;padding:8px 12px;cursor:pointer}
  .guide .gh b{font-size:13px}
  .guide .gp{color:var(--dim);font-variant-numeric:tabular-nums}
  .guide .gsteps{border-top:1px solid var(--line);padding:4px 0}
  .guide .gs{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:5px 12px;align-items:start}
  .guide .gs .mk{text-align:center}
  .guide .gs.done{color:var(--dim)}
  .guide .gs.now{background:color-mix(in srgb,var(--ok) 7%,transparent);border-left:2px solid var(--ok);padding-left:10px}
  .guide .gs.blocked{color:var(--dim)}
  .guide .gs .ti{font-weight:600}
  .guide .gs.done .ti{font-weight:400}
  .guide .gs .de{color:var(--dim)}
  .guide .gs .hi{margin-top:2px}
  .guide .gs .act{margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .guide code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;
              font:12px ui-monospace,Consolas,monospace;user-select:all}
  .guide .why{color:var(--dim2);font-size:11.5px;margin-top:3px}
  .quick{display:flex;gap:6px;align-items:center;padding:2px 14px 8px;font-size:12px;flex-wrap:wrap}
  .quick .lbl{color:var(--dim)}
  #quick-list{flex-basis:100%;display:flex;flex-direction:column;gap:2px}
  #quick-list .rq{color:var(--dim)} #quick-list .rq.late{color:var(--warn)} #quick-list .rq.acked{color:var(--fg)}
  .line-add{display:flex;gap:6px;align-items:center;padding:4px 14px 8px;font-size:12px;flex-wrap:wrap}
  .line-add input{width:11em}
  .line-add .note.ok{color:var(--ok)} .line-add .note.bad{color:var(--warn)}
  .tag.offrig{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border:1px dashed var(--warn)}
  /* Held by the no-progress brake: dimmed rather than alarming — nothing is wrong,
     the board is declining to spend. Solid border (a stated decision), not dashed
     (which reads on this panel as "something is off").
     ⚠ --dim, not a --muted: this palette has no --muted, and an undefined var
     voids the whole declaration silently — measured, the badge rendered with no
     background or border at all while the rule sat in the stylesheet looking fine. */
  .tag.nopro{background:color-mix(in srgb,var(--dim) 14%,transparent);color:var(--dim);border:1px solid color-mix(in srgb,var(--dim) 45%,transparent)}
  button.danger{border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}

  .rig{display:flex;gap:7px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);
       align-items:center;background:var(--panel)}
  .rig .lbl{color:var(--dim);font-size:11.5px;margin-right:2px}
  .wk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
      padding:3px 4px 3px 9px;font-size:11.5px}
  .wk .nm{font-weight:600}
  .wk .st{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
  .wk.on .st{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  .wk .tail{color:var(--dim);font-size:10.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .ctx{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .ctx > h2{margin:0;padding:9px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);
            display:flex;align-items:center;gap:8px;cursor:pointer}
  .ctx > h2 .n{color:var(--dim);font-weight:400}

  .cl .nm{font-weight:600}
  .bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--ok)}

         border-top:1px solid var(--line);padding:7px 16px;color:var(--dim);font-size:11.5px;

<body>
<header>
  <h1>AI 舰队看板</h1>

<form class="task-find" id="task-find" role="search">

<div class="upg" id="upg" hidden></div>
<div class="guide" id="guide" hidden></div>
<div class="rig" id="rig"></div>
<!-- v0.4: add a line from the panel — static markup on purpose: #rig is
     re-rendered on every refresh and would erase an in-progress entry. -->

  <label for="line-add-id">加线</label>

  <input id="line-add-hint" placeholder="一句用途(可选)" maxlength="80">

<!-- v0.5: shortcut requests to the coordinator seat. A press writes a durable
     row and wakes the seat through its SSE sentry; the seat acks/dones via
     board.py and the list below shows the loop closing — or NOT closing. -->
<div class="quick" id="quick">
  <span class="lbl">协调席快捷指令</span>
  <button data-quick="propose-lines" title="点击=授权协调席只读检索你最近的会话(标题与相关片段,不外发),访谈后起草自动拉取线">根据我最近的对话起草线路</button>
  <select id="quick-days" title="检索范围"><option value="7">近 7 天</option><option value="14" selected>近 14 天</option><option value="30">近 30 天</option></select>
  <button data-quick="mount-sentries" title="让协调席把两哨挂到它的持续监视下">挂哨</button>

</div>
<div class="pick" id="pick"></div>
<div class="cfg" id="cfg"></div>
<!-- The edit popup borrows class="cfg" WHOLESALE (no new visual language = zero new
     CSS); only the id differs so open/close is independent. -->
<div class="cfg" id="edit"></div>
<div class="modal" id="modal"><div class="box">

    <span class="sp"><button id="modal-copy">复制</button><button id="modal-x">关闭</button></span></div>

</div></div>

    <span class="sp"><button id="decision-modal-x">关闭</button></span></div>

</div></div>

<div class="ctxwrap"><section class="ctx" id="ctx">
  <h2>上下文 <span class="n" id="ctx-sum"></span></h2>
  <div class="body" id="ctx-body"></div>
</section></div>

  <h2>时间轴 <span class="n" id="tl-sum"></span></h2>
  <div class="body" id="tl-body"><div id="tl-bar"><button id="tl-mode-lin">谱系</button><button id="tl-mode-load">负载</button><span style="width:6px"></span><button id="tl-prev">◀</button><input type="date" id="tl-date"><button id="tl-next">▶</button><button id="tl-fit" class="pri">聚焦活动</button><button id="tl-day">全天</button><span id="tl-note"></span></div><div id="tl-scroll"></div></div>
</section></div>

<div class="cols" id="cols"></div>

  <span>归档 <b id="f-arch">–</b> 件</span>
  <span>uptime <b id="f-up">–</b></span>
  <span>版本 <b id="f-rev">–</b></span>
  <span>未开始 <b id="f-ns">–</b> · 进行中 <b id="f-ip">–</b> · 等待中 <b id="f-wa">–</b> · 已完成 <b id="f-dn">–</b></span>
  <span style="margin-left:auto" id="f-when">–</span>
</footer>

<script>
// Writes carry the token; the server injects it into the page (readable same-origin only).
const WH = { "Content-Type":"application/json", "X-Board-Token": window.__BOARD_TOKEN || "" };
// Five columns. Goal is a KIND, not a status — the state machine still has four values.
const COLS = [
  ["goal",        "目标"],
  ["not_started", "未开始"],
  ["in_progress", "进行中"],
  ["waiting",     "等待中"],
  ["done",        "已完成"],
];
// ⚠ This label table is deliberately the same thing written in two places — the CLI
//   (cli/board.py, WF) carries its own copy. Grow only one side and the other shows
//   the raw code (measured: `confirm` was the one missing).
const WF_LABEL = { review:"待验收", confirm:"待确认", decision:"待裁定", dep:"待依赖", rearm:"等待重审" };
// Line colors are assigned from a palette by the line's index in the server-sent
// LINES (lines are fleet config, not this file's business). Roles keep the accent.
const PALETTE = ["#5b9dff","#f0883e","#3ecf8e","#f2555a","#c084fc","#e8b93a","#6fd3c7","#d38fd3"];
const lineColor = (l) => {
  const root = String(l || "").replace(/@\d+$/, "");
  if (root === "review") return "#c084fc";
  const i = LINES.indexOf(root);
  return i >= 0 ? PALETTE[i % PALETTE.length] : "#5d6472";
};
const lineLabel = (l) => String(l || "") || "未指派";
// Runtime badge text: conventional short forms with a generic fallback.
const RT_BADGE = { claude: "CC", codex: "CX" };
const rtColor = (rt) => rt === "codex" ? "#b07dd8" : "var(--cc)";
// ⭐ Post-decompose hint. ONE copy of the wording (two decompose entrances; written
//   separately, only one gets fixed — measured, twice, including a hint that
//   promised an action this panel cannot perform). It states only who releases and
//   what happens here, which is correct for every reader.
const HOLD_HINT = `拆出的子卡已就位,但**目标未放行前,一张也不会被领**(祖先放行不变量)。
放行整链 = 放行这个目标(board.py release <目标id>);只想放一部分,给其余子卡 hold。
在此检查内容;有问题就在输入框写明(=回原线继续),或用 [编辑]。`;

let tasks = [], taskEvents = [], meta = {}, skew = 0;   // skew = server time - local time
let usageByCard = {};                                    // card id -> aggregated token usage
// Token counts read at a glance: 1234 -> 1.2k, 2456789 -> 2.5M. One decimal is
// plenty for a card face; the ledger holds the exact numbers.
const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);

// What a human typed must survive re-renders (same logic as the evidence box that
// used to fold one second after opening).
const verdictDraft = new Map();
const decisionChoice = new Map();
const receiptDraft = new Map();
const outcomeDraft = new Map();
document.addEventListener("input", (e) => {
  const receiptId = e.target.dataset?.handoffReceipt;
  if (receiptId){
    receiptDraft.set(Number(receiptId), e.target.value);
    const scope = e.target.closest("[data-decision-scope]") || e.target.closest(".card");
    if (scope) syncDecision(scope, byId.get(Number(receiptId)));
    return;
  }
  const id = e.target.dataset?.vin; if (!id) return;
  verdictDraft.set(Number(id), e.target.value);
  const scope = e.target.closest(".card") || e.target.closest("[data-decision-scope]");
  if (scope) syncHandoff(scope);
});
document.addEventListener("change", (e) => {
  const outcomeId = e.target.dataset?.handoffOutcome;
  if (outcomeId){
    outcomeDraft.set(Number(outcomeId), e.target.value);
    const scope = e.target.closest(".card") || e.target.closest("[data-decision-scope]");
    if (scope) syncDecision(scope, byId.get(Number(outcomeId)));
    return;
  }
  const id = e.target.dataset?.choice; if (!id) return;
  decisionChoice.set(Number(id), e.target.value);
  const scope = e.target.closest(".card") || e.target.closest("[data-decision-scope]");
  if (scope) syncDecision(scope, byId.get(Number(id)));
});

const modal = document.getElementById("modal");
function openModal(title, text){
  document.getElementById("modal-t").textContent = title;
  document.getElementById("modal-b").textContent = text;
  modal.classList.add("show");
}
const closeModal = () => modal.classList.remove("show");
document.getElementById("modal-x").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeDecisionModal(); } });
document.getElementById("modal-copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(document.getElementById("modal-b").textContent);
        document.getElementById("modal-copy").textContent = "已复制";
        setTimeout(() => document.getElementById("modal-copy").textContent = "复制", 1200); }
  catch { document.getElementById("modal-copy").textContent = "复制失败"; }
});
const decisionModal = document.getElementById("decision-modal");
const closeDecisionModal = () => decisionModal.classList.remove("show");
document.getElementById("decision-modal-x").addEventListener("click", closeDecisionModal);
decisionModal.addEventListener("click", (e) => { if (e.target === decisionModal) closeDecisionModal(); });
function openDecisionModal(t){
  document.getElementById("decision-modal-t").textContent = `#${t.id} 最终裁定 — ${t.subject}`;
  const box = document.getElementById("decision-modal-b");
  box.innerHTML = decisionPanel(t) +
    `<div class="hf-receipt" data-receipt-wrap="${t.id}" hidden>` +
      `<div class="hf-outcome-title">执行结果(必选)</div>` +
      `<div class="hf-outcomes" role="radiogroup" aria-label="执行结果">` +
        `<label><input type="radio" name="hf-outcome-${t.id}" data-handoff-outcome="${t.id}" value="success">` +
          `<span>执行成功<small>已应用;交回 Agent 做结果验证</small></span></label>` +
        `<label class="failure"><input type="radio" name="hf-outcome-${t.id}" data-handoff-outcome="${t.id}" value="failure">` +
          `<span>执行失败<small>算已尝试;未应用;交回 Agent 修正</small></span></label></div>` +
      `<label for="hf-receipt-${t.id}">执行回执(必填,原文保留)</label>` +
      `<textarea id="hf-receipt-${t.id}" data-handoff-receipt="${t.id}" rows="3" ` +
        `placeholder="粘贴你应用之处返回的原始回执;成功或报错都可以。请另补执行时间、环境和影响范围。"></textarea>` +
      `<div class="hint">失败也算实际执行过,但不会记成已应用。不要粘贴密钥或客户明细;回执会逐字交回原 Agent。</div></div>` +
    `<textarea class="vin" data-vin="${t.id}" rows="2" placeholder="可选:补充给原 Agent 的一句指示"></textarea>` +
    `<div class="hoh" data-hoh></div><div class="acts decision-actions">` +
    `<button class="pri" data-decide="${t.id}" disabled>先选择 A / B / C</button>` +
    `<button data-final-close="${t.id}">无需后续 · 结案</button></div>`;
  const vin = box.querySelector("[data-vin]");
  if (vin) vin.value = verdictDraft.get(t.id) || "";
  const receipt = box.querySelector("[data-handoff-receipt]");
  if (receipt) receipt.value = receiptDraft.get(t.id) || "";
  syncHandoff(decisionModal.querySelector("[data-decision-scope]"));
  decisionModal.classList.add("show");
}
document.addEventListener("dblclick", (e) => {
  const box = e.target.closest("[data-ev]"); if (!box) return;
  const [id, kind] = box.dataset.ev.split(":");
  const t = byId.get(Number(id)); if (!t) return;
  openModal(`#${t.id} ${kind === "ev" ? "证据 / 原因" : "裁定记录"} — ${t.subject}`,
            (kind === "ev" ? t.result : t.verdict_note) || "");
});

const byId = new Map();
let focusId = null, relSet = new Set(), DECOMP = [];
let locatedId = null, locateScrollPending = false;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const now = () => Date.now() + skew;

const taskColumn = (t) => t.status === "done" ? "done" : (t.kind === "goal" ? "goal" : t.status);
function setFindNote(text, tone=""){
  const note = document.getElementById("task-find-note");
  note.textContent = text;
  note.className = "note" + (tone ? " " + tone : "");
}
function clearLocated({ clearInput=true }={}){
  locatedId = null; locateScrollPending = false;
  if (clearInput) document.getElementById("task-find-id").value = "";
  document.getElementById("task-find-clear").disabled = true;
  setFindNote("输入号码后,该卡会临时置于所属栏最上方");
  render();
}
function locateByInput(){
  const input = document.getElementById("task-find-id");
  const m = input.value.match(/^\s*#?\s*(\d+)\s*$/);
  if (!m){ setFindNote("请输入卡号,例如 215 或 #215", "bad"); input.select(); return; }
  const id = Number(m[1]), task = byId.get(id);
  if (!task){ setFindNote(`#${id} 不在当前看板中(可能已归档)`, "bad"); input.select(); return; }
  locatedId = id; locateScrollPending = true;
  document.getElementById("task-find-clear").disabled = false;
  setFindNote(`#${id} 已定位到「${COLS.find(([k]) => k === taskColumn(task))?.[1] || task.status}」栏顶`, "ok");
  render();
}
document.getElementById("task-find").addEventListener("submit", (e) => { e.preventDefault(); locateByInput(); });
document.getElementById("task-find-clear").addEventListener("click", () => clearLocated());
document.getElementById("task-find-id").addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (locatedId != null || e.target.value)) { e.stopPropagation(); clearLocated(); }
});

function decisionPanel(t, compact=false){
  const p = t.decision_package;
  if (!p || !Array.isArray(p.options) || !p.options.length) return "";
  if (compact) return `<section class="decision compact">
    <div class="decision-h"><b>最终裁定</b>${p.recommend ? `<span class="rec">推荐 ${esc(p.recommend)}</span>` : ""}</div>
    <div class="decision-summary">${esc(p.summary || p.reason || "需要你选择后续方案。")}</div>
    <button class="decision-open" data-open-decision="${t.id}">展开 A / B / C 与附件</button>
  </section>`;
  const picked = decisionChoice.get(t.id) || "";
  const opts = p.options.map((o) => {
    const chosen = picked === o.key;
    const rec = String(p.recommend || "").toUpperCase() === o.key;
    // ⚠ Measured: showing names alone collapsed `migrations/0119_….sql` (the apply
    //   body, absent) and `tools/verify/0119.sql` (a fragment, present) into
    //   the same "0119" on screen — readable as "0119 does not exist yet 0119 can
    //   be downloaded". The DIRECTORY rides along; the full path does not (telling
    //   them apart needs only the layer).
    const dirTag = (f) => f.dir ? `<span class="hf-dir">${esc(f.dir)}/</span>` : "";
    const files = (o.files || []).map((f) => {
      const name = `${dirTag(f)}${esc(f.archive_name || f.name || "file")}`;
      // Split by ROLE only — never guess from file names or dirs: companions are
      // viewable but are not executable downloads.
      if (f.role === "companion") {
        const view = f.available && f.view_url
          ? `<a data-stop data-handoff-action="reference" href="${esc(f.view_url)}" target="_blank" rel="noopener">查看内容</a>`
          : `<span class="hf-warn">${esc(f.error || "不可查阅")}</span>`;
        return `<span class="hf-companion" data-handoff-role="companion"><span>ⓘ ${name}</span><b>非执行用 · 仅供查阅</b>${view}</span>`;
      }
      return f.available && f.download_url
        ? `<a class="hf-download" data-stop data-handoff-role="${esc(f.role)}" data-handoff-action="download" href="${esc(f.download_url)}" download="${esc(f.archive_name || f.name)}">↓ 执行用下载 · ${name} · ${esc(f.role)}${f.target_label ? " · →" + esc(f.target_label) : ""}</a>`
        : `<span class="hf-warn" data-handoff-role="${esc(f.role)}">${name} · ${esc(f.role)}: ${esc(f.error || "不可下载")}</span>`;
    }).join("");
    const warn = o.kind === "apply" && !o.ready
      ? `<div class="hf-warn">⚠ 本方案的文件尚未补齐;仍可选择本方案,并交回 Agent 补齐文件。当前不会应用或归档任何文件。</div>` : "";
    return `<label class="dopt${chosen ? " chosen" : ""}${rec ? " recommended" : ""}${!o.ready ? " unready" : ""}">
      <div class="dopt-head"><input type="radio" name="decision-${t.id}" data-choice="${t.id}" value="${esc(o.key)}"
        ${chosen ? "checked" : ""}>
        <span class="key">${esc(o.key)}</span><span>${esc(o.title)}</span>
        ${rec ? `<span class="flag">recommended</span>` : ""}</div>
      ${o.detail ? `<div class="dopt-detail">${esc(o.detail)}</div>` : ""}
      ${o.cost ? `<div class="dopt-cost"><b>Cost / risk:</b> ${esc(o.cost)}</div>` : ""}
      ${files ? `<div class="hf-files">${files}</div>` : ""}${warn}
    </label>`;
  }).join("");
  return `<section class="decision" data-decision="${t.id}">
    <div class="decision-h"><b>Final ruling</b><span class="tag wf confirm">请选择 A / B / C</span>
      ${p.recommend ? `<span class="rec">recommended: ${esc(p.recommend)}</span>` : ""}</div>
    <div class="decision-summary">${esc(p.summary || p.reason || "需要你选择后续方案。")}</div>
    <div class="decision-options">${opts}</div>
    <div class="decision-foot">文件未补齐:可直接选该方案并交回 Agent 补齐。文件已齐且实际应用过(成功或失败):选择结果并填写原始回执后确认;系统不会替你执行任何操作,只记录选择、结果、回执,并把本轮文件归档到已授权的 handoff 目标。</div>
  </section>`;
}

function ago(ms){
  if (ms == null) return null;
  const s = Math.max(0, Math.round((now() - ms) / 1000));
  if (s < 60) return s + "s 前";
  if (s < 3600) return Math.floor(s/60) + "m" + (s%60 ? (s%60)+"s" : "") + " 前";
  return Math.floor(s/3600) + "h" + Math.floor((s%3600)/60) + "m 前";
}

// The DB stores ISO UTC. Slicing the string shows the wrong wall time — always
// pass through the local timezone.
function localTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(5,16).replace("T"," ");
  const p = (n) => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ⭐ With many parallel windows this is THE thing to watch: telling "running" from
//   "dead but the lease has not expired yet".
function hbClass(t){
  if (t.status !== "in_progress") return "";
  if (t.lease_until && now() > t.lease_until) return "dead";   // lease over = dead for sure
  if (!t.heartbeat_at) return "dead";
  const age = (now() - t.heartbeat_at) / 1000;
  // Heartbeats come every 30s. Three minutes of silence = dead even with lease left —
  // "yellow until the lease expires" leaves a card that died 20 minutes ago sitting
  // in a calm color.
  if (age > 180) return "dead";
  return age > 60 ? "stale" : "fresh";
}

// Returns CONTENT only, no nodes. Node creation/reuse is upsert()'s job — merged,
// "same card = same node" cannot hold and the thing to animate vanishes each time.
function cardParts(t){
  const lc = lineColor(t.line);
  const who = t.status === "in_progress" ? (t.worker || t.line) : t.line;

  let top = `<span class="id">#${t.id}</span>`;
  // ⭐ Badge semantics: unclaimed = executor family (route); once claimed = the
  //   ACTUAL runtime (last_runtime, stamped by the loop at claim). ⛔ route never
  //   becomes runtime-valued — cards must not nominate runtimes (rung/quota
  //   allocation never belongs to card authors); the badge only reports afterwards.
  const rtKey = t.last_runtime || t.route;
  const rtTxt = t.last_runtime
    ? (RT_BADGE[t.last_runtime] || String(t.last_runtime).toUpperCase())
    : t.route.toUpperCase();
  top += `<span class="tag" style="color:${t.last_runtime ? rtColor(t.last_runtime) : "var(--dim)"};border-color:color-mix(in srgb,${t.last_runtime ? rtColor(t.last_runtime) : "var(--dim)"} 45%,transparent)" title="${t.last_runtime
    ? `运行: ${esc(t.last_runtime)}` : `路由族: ${esc(t.route)}(未领,认领后显示实际运行方)`}">${esc(rtTxt)}</span>`;
  // Derived cards state their origin (chains like #8→#51→#83 are untraceable
  // without it). The chain is walked from the local full set; clicking lights the
  // family (existing focus machinery).
  if (t.parent_id != null){
    const chain = []; let cur = byId.get(t.parent_id), g = 0;
    while (cur && g++ < 10){ chain.unshift("#" + cur.id); cur = cur.parent_id != null ? byId.get(cur.parent_id) : null; }
    if (t.parent_id != null && !chain.length) chain.push("#" + t.parent_id + "(已归档)");
    const pt = byId.get(t.parent_id);
    const pv = pt ? (pt.kind === "goal" ? "#c084fc" : lineColor(pt.line)) : "#5d6472";
    top += `<span class="tag lineage" style="color:${pv}" title="派生链(染色=父卡的线) · 点卡可高亮全家">↳${chain.join("→")}</span>`;
  }
  const editable = t.status === "not_started" || t.status === "waiting";
  top += `<span class="line-badge${editable ? "" : " ro"}" style="background:${lineColor(who)}"` +
         (editable ? ` data-pick="${t.id}"` : "") + `>${esc(lineLabel(who))}</span>`;
  // Provenance badge: display/reference only (never routing). The full move audit
  // is in the card description.
  if (t.prev_line){
    const pc2 = lineColor(t.prev_line);
    top += `<span class="line-badge ro" style="background:transparent;border:1px dashed ${pc2};color:${pc2};opacity:.8" title="来历: 由 ${esc(lineLabel(t.prev_line))} 线移来(移线审计见卡面描述)">←${esc(lineLabel(t.prev_line))}</span>`;
  }
  if (t.pinned_at) top += `<span class="tag pinned">置顶</span>`;
  // A card a human wrote on and handed back. Explains "approved yet sitting in
  // not_started". Criterion = last_verdict (this round's ruling): verdict now
  // belongs to closed cards only, so the old criterion would never show this badge
  // again. `|| t.verdict` covers older boards.
  if ((t.last_verdict || t.verdict) && t.status === "not_started")
    // No approval/bounce vocabulary — a badge keeping deleted vocabulary breeds
    // "where is the bounce button". State only what happened.
    top += `<span class="tag tocoord">你写了指示 · 回原线继续</span>`;
  if (!t.released && t.kind !== "goal") {
    // Show the card's age in the staging area — an uplifted card once sat unnoticed
    // for days.
    const ageH = Math.floor((Date.now() - Date.parse(t.updated_at || t.created_at || 0)) / 3600000);
    top += `<span class="tag hold"${ageH >= 48 ? ' style="outline:1px solid var(--warn)"' : ""}>未放行${
      ageH >= 24 ? "·" + Math.floor(ageH / 24) + "天" : ""}</span>`;
  }
  // ⭐ Human-gated: out of the queue, attempts unburned — the board must show WHO it
  //   is waiting for.
  if (t.human_gate) top += `<span class="tag hold">待人工</span>`;
  if (t.lock_key) top += `<span class="tag lock">🔒${esc(t.lock_key)}</span>`;
  // ── Linked closure: the declaration is the FORECAST, cascade is the RESULT.
  //   Both show — forecast alone leaves "why did it close" unreadable, result alone
  //   leaves "why could it close".
  if (t.oneof_key) top += `<span class="tag oneof" title="同一个父下,这一组只要有一张走通(且通过机器验证),其余自动关闭">备选组·${esc(t.oneof_key)}</span>`;
  if (t.proves_parent) top += `<span class="tag oneof" title="本卡的验证通过即回答了父卡的问题 —— 父卡会联动结案">验证父卡</span>`;
  if (t.resolved_by === "cascade") top += `<span class="tag casc" title="非人工裁定:同链另一张卡通过机器验证,本卡因此不再需要。理由见卡面裁定记录">联动关闭</span>`;
  if (t.status === "waiting" && t.waiting_for)
    top += `<span class="tag wf ${t.waiting_for}">${WF_LABEL[t.waiting_for] || t.waiting_for}</span>`;

  let meta2 = [];
  if (t.status === "in_progress"){
    meta2.push(`<span class="hb" data-live="hb"></span>`);
    if (t.lease_until) meta2.push(`<span data-live="lease"></span>`);
  }
  if (t.attempts > 0){
    const hot = t.attempts >= t.max_attempts ? " hot" : "";
    meta2.push(`<span class="att${hot}">尝试 ${t.attempts}/${t.max_attempts}</span>`);
    // ⭐ In progress, but by a worker that is NOT a running supervised slot —
    //   a hand-run `--once`, a coordinator claiming with board.py, an outside
    //   process. Not forbidden; made VISIBLE, because the rig row says
    //   "stopped" while the card moves, and an operator reading the rig has no
    //   other way to know (a deployment hit exactly this and called it a bug).
    if (t.status === "in_progress" && t.worker && !liveWorkerNames().has(t.worker))
      meta2.push(`<span class="tag offrig" title="持卡的 worker「${esc(t.worker)}」不是任何在跑的自动拉取槽 —— 这张卡在板外被推进(手动 --once / CLI 认领 / 外部进程)。预算·阶梯·账本只在自动拉取里存在">板外在跑</span>`);
  }
  // ⭐ The no-progress brake is holding this card. Without saying so, the card reads
  //   as "queued, waiting its turn" while the queue will in fact never hand it out —
  //   a stop that cannot state its reason is the failure mode this board keeps
  //   naming. The criterion comes from the server (same function claim uses).
  if (t.no_progress) {
    const since = String(t.no_progress.since || "").replace("T", " ").slice(0, 16);
    meta2.push(`<span class="tag nopro" title="自上次派发(${esc(since)})以来,这张卡的卡面、依赖、裁定意见、工作树都没有变化 —— 再派一次模型会看到一模一样的世界,得出一模一样的结论。给它新输入(补充卡面 / 写裁定意见 / 推进依赖 / 更新工作树)它就会自己恢复;确实要照跑,用点名认领的强制选项">⏸ 无进展</span>`);
  }
  // ⭐ What this card has actually burned, on its face. 输入+输出 is the money side;
  //   缓存读 rides cheap and is shown apart so a big number is readable as "warm
  //   cache", not "expensive card". Cards that never ran a model show nothing.
  {
    const u = usageByCard[t.id];
    if (u && (u.in || u.out || u.cr || u.cc)) {
      meta2.push(`<span class="tok" title="token 消耗(本卡累计,自 usage_ledger)
输入 ${u["in"]} · 输出 ${u.out} · 缓存读 ${u.cr} · 缓存写 ${u.cc} · 调用 ${u.calls} 次">` +
        `tok ${fmtTok(u["in"] + u.out)}` + (u.cr ? `<small>+缓存读${fmtTok(u.cr)}</small>` : ``) + `</span>`);
    }
  }
  if (t.blocked_by && t.blocked_by.length) meta2.push(`<span>依赖 #${t.blocked_by.join(" #")}</span>`);
  if (t.status === "done"){
    if (t.resolved_by === "auto") meta2.push(`<span class="tag auto">自动通过</span>`);
    else if (t.resolved_by) meta2.push(`<span class="tag manual">手动通过</span>`);
    if (t.updated_at) meta2.push(`<span>${esc(localTime(t.updated_at))}</span>`);
  }

  let body = `<div class="top">${top}</div><div class="subj">${esc(t.subject)}</div>`;
  if (meta2.length) body += `<div class="meta">${meta2.join("")}</div>`;
  if (t.status === "waiting") body += decisionPanel(t, true);
  // Folded text is too small to read — show a digest, DOUBLE-CLICK opens the full
  // text large.
  const ev = (k, label, text) =>
    `<div class="ev" data-ev="${t.id}:${k}" title="双击查看全文">
       <div class="evh"><span>${label}</span><span class="hint">双击展开</span></div>
       <div class="evp">${esc(String(text).replace(/\s+/g, " ").slice(0, 160))}</div>
     </div>`;
  if (t.result) body += ev("ev", "evidence / reason", t.result);
  if (t.verdict_note) body += ev("vn", t.decision_package ? "自动审阅原始记录" : "裁定记录", t.verdict_note);

  // ⛔ No "stuck" column exists. Both flavors of waiting are told apart by the
  //   waiting_for badge.
  let acts = "";
  if (t.kind === "goal"){
    // A goal card carries only pin. Release is the children's business; decompose
    // belongs to the input box above.
    const on = !!t.pinned_at;
    acts += `<button class="${on ? "pri" : ""}" data-pin="${t.id}" data-on="${on ? 1 : 0}">` +
            `${on ? "已置顶 · 取消" : "置顶"}</button>`;
    // A goal whose decomposition came up empty must be re-runnable from here.
    if (!tasks.some((x) => x.parent_id === t.id) && t.status !== "done")
      acts += `<button data-dec="${t.id}">重新拆解</button>`;
  }
  if (t.status === "waiting"){
    // A place to write your own words BEFORE ruling; the same box serves both roads.
    // ⚠ Draft content is NOT embedded in the html — embedded, every keystroke would
    //   change the signature, replace innerHTML and throw the caret. Values are
    //   poured in afterwards.
    if (!t.decision_package?.options?.length){
      body += `<textarea class="vin" data-vin="${t.id}" rows="2" placeholder="可选:补充给原 Agent 的一句指示"></textarea>`;
      body += `<div class="hoh" data-hoh></div>`;
    }
    // ⭐ Ruling: the human "bounce" button is GONE. The button chooses CLOSE OR NOT —
    //   write = hand back, empty = close. One button says it all. (The machine
    //   bounce — auto-review — is a separate road; the API's verdict:'reject' is
    //   unchanged.)
    if (!t.decision_package?.options?.length){
      acts += `<button class="pri" data-a="approve" data-id="${t.id}">结案</button>`;
    }
    // [Edit]: fix line/route/caps WITHOUT rebuilding the card. Bounce-and-rebuild
    // severs attempts, derivations and ruling records — untraceable afterwards.
    acts += `<button data-edit="${t.id}">编辑</button>`;
  }
  if (t.status === "done" || t.status === "waiting" || t.kind === "goal")
    acts += `<button class="danger" data-a="archive" data-id="${t.id}">归档</button>`;
  if (acts) body += `<div class="acts">${acts}</div>`;

  if (t.kind === "goal"){
    const kids = tasks.filter((x) => x.parent_id === t.id);
    const d = kids.filter((k) => k.status === "done").length;
    body += `<div class="kids">子任务卡 ${d}/${kids.length} 完成</div>`;
  } else {
    // In-flight cards derive their own children (a worker splitting its card,
    // discoveries cut out mid-run). Without hanging them under the parent, the
    // board loses which stream they came from.
    const kids = tasks.filter((x) => x.parent_id === t.id);
    if (kids.length){
      const ST = { not_started:"未开始", in_progress:"进行中", waiting:"等待中", done:"已完成" };
      body += `<div class="subs"><div class="h">子任务卡 ${kids.filter((k) => k.status === "done").length}/${kids.length}</div>` +
        kids.map((k) => `<div class="sub"><span class="sid">#${k.id}</span>` +
          `<span class="stt ${k.status}">${ST[k.status] || k.status}</span>` +
          `<span class="sj">${esc(k.subject)}</span></div>`).join("") + `</div>`;
    }
  }
  let cls = "card";
  if (focusId != null && relSet.has(t.id)) cls += (t.id === focusId ? " self" : " rel");
  if (t.id === locatedId) cls += " located";
  return { html: body, cls };
}

// The per-second pass ONLY rewrites running numbers. The DOM is not rebuilt = open
// state, scroll position and text selection all survive.
function tick(){
  for (const el of document.querySelectorAll(".card[data-id]")){
    const t = byId.get(Number(el.dataset.id));
    if (!t || t.status !== "in_progress") continue;
    const hb = el.querySelector('[data-live="hb"]');
    if (hb){
      hb.className = "hb " + hbClass(t);
      hb.textContent = "♥ " + (t.heartbeat_at ? ago(t.heartbeat_at) : "无心跳");
    }
    const ls = el.querySelector('[data-live="lease"]');
    if (ls && t.lease_until){
      const left = Math.round((t.lease_until - now())/1000);
      if (left > 0){ ls.className = ""; ls.textContent = `租约 ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; }
      else { ls.className = "hb dead"; ls.textContent = "租约已过"; }
    }
  }
}

function rowsFor(key){
  if (key === "goal")  return tasks.filter((t) => t.kind === "goal" && t.status !== "done")
    .sort((a, b) => String(b.pinned_at || "").localeCompare(String(a.pinned_at || "")) || a.id - b.id);
  if (key === "done")  return null;   // done is drawn split into goals and children
  if (key === "waiting"){
    // Ruling: what waits on a HUMAN ruling floats up. confirm topmost; the
    // machine-tended re-review sits at the bottom (no human attention needed now).
    // Stable id order within a tier.
    const pri = { confirm: 0, decision: 1, review: 2, dep: 3, rearm: 4 };
    return tasks.filter((t) => t.kind !== "goal" && t.status === "waiting")
      .sort((a, b) => (pri[a.waiting_for] ?? 9) - (pri[b.waiting_for] ?? 9) || a.id - b.id);
  }
  return tasks.filter((t) => t.kind !== "goal" && t.status === key);
}
// Related items float up: gather the stream around the one thing being looked at.
const pinRelated = (rows) => focusId == null ? rows
  : [...rows].sort((a, b) => (relSet.has(b.id) ? 1 : 0) - (relSet.has(a.id) ? 1 : 0));

// ── Node identity ──────────────────────────────────────────────────────
// The foundation of everything: rebuilding cards each time means "the same thing to
// move" never exists — no animation is possible. Not rebuilding ALSO protects
// drafts, open state, scroll position and selection (they used to vanish every 15s).
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const cardNodes = new Map();     // id -> DOM
let shell = null;                // key -> { col, list, n, empty, divider }

function ensureShell(){
  if (shell) return shell;
  const root = document.getElementById("cols");
  root.innerHTML = "";
  shell = new Map();
  for (const [key, label] of COLS){
    const col = document.createElement("section");
    col.className = "col"; col.dataset.s = key;
    const h2 = document.createElement("h2");
    h2.innerHTML = `${label}<span class="n"></span>`;
    col.appendChild(h2);
    if (key === "goal"){
      // ⚠ Built ONCE. When it was rebuilt every cycle, the 15s refresh erased goals
      //   being typed.
      const box = document.createElement("div");
      box.className = "goalbox";
      box.innerHTML = `<textarea id="goal-in" placeholder="写下一个目标"></textarea>
        <div class="rowb">
          <select id="goal-prev" title="衔接既往目标:拆解时参考其完成记录,避免重做已完成的工作"></select>
        </div>
        <div class="rowb">
          <select id="goal-model">${DECOMP.map((m) => `<option value="${m.id}">${esc(m.label)}</option>`).join("")}</select>
          <button class="pri" id="goal-add">加入并拆解</button>
        </div>`;
      col.appendChild(box);
    }
    const list = document.createElement("div"); list.className = "list";
    col.appendChild(list); root.appendChild(col);
    const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "—";
    const divider = document.createElement("div"); divider.className = "divider";
    shell.set(key, { col, list, n: h2.querySelector(".n"), empty, divider });
  }
  return shell;
}

/** Arm a two-press button: swap the caption, then pin the button's width to the
 *  wider of the two states. ⭐ Armed captions are longer than resting ones; without
 *  the pin the button reflows on the FIRST press and the muscle-memory second
 *  press aims at geometry that no longer exists (measured in a cold-machine
 *  walkthrough: 25–30px center shift between the two presses). */
function armSwap(b, text){
  const w0 = b.offsetWidth;
  b.textContent = text;
  b.style.width = Math.max(w0, b.offsetWidth) + "px";
}
function disarmRestore(b){
  b.style.width = "";
  if (b.dataset.orig) b.textContent = b.dataset.orig;
}

/** Button captions follow whether the input holds text.
 *  ⭐ "What happens when I press" must be visible BEFORE pressing — measured without
 *  this, a human meant to pick option A and closed the card instead. */
function syncHandoff(scope){
  const vin = scope.querySelector("[data-vin]");
  if (!vin) return;
  const tid = Number(vin.dataset.vin);
  if (scope.querySelector("[data-decision]")){
    syncDecision(scope, byId.get(tid));
    return;
  }
  const on = vin.value.trim().length > 0;
  // ⭐ One button, TWO meanings — the caption says which, literally. It used to say
  //   "approve" while text present meant not-closing: display and behavior split.
  for (const b of scope.querySelectorAll("[data-a='approve']")){
    b.textContent = on ? "回原线继续" : "结案";
    b.classList.toggle("handoff", on);
  }
  const h = scope.querySelector("[data-hoh]");
  // ⭐ The bounce hint must state the REAL budget mechanics: a claim = a new
  //   dispatch = the per-dispatch budget resets in full (store re-stamps
  //   attempts_base). The old wording "续 1 次尝试预算" described a +1 that does
  //   not exist — a cold-machine walkthrough read the API after a bounce, saw
  //   nothing "+1", and correctly could not reconcile the two.
  if (h) h.textContent = on
    ? "按下=**不结案** —— 这段文字作为指令交回原 Agent 继续;卡回到原线,下次认领按新一轮派发计算尝试预算(attempts 累计不清零,预算锚在认领时重打)"
    : "空白提交=**结案**(计入已完成)。需修改或继续:先在上方写明指示再提交 —— 未写指示不会产生后续动作";
}

function syncDecision(scope, t){
  if (!t?.decision_package) return;
  const key = decisionChoice.get(t.id) || scope.querySelector(`[data-choice="${t.id}"]:checked`)?.value || "";
  const opt = (t.decision_package.options || []).find((o) => o.key === key);
  for (const radio of scope.querySelectorAll(`[data-choice="${t.id}"]`)){
    radio.checked = radio.value === key;
    radio.closest(".dopt")?.classList.toggle("chosen", radio.checked);
  }
  const incompleteApply = opt?.kind === "apply" && !opt.ready;
  const executedApply = opt?.kind === "apply" && opt.ready;
  const outcome = outcomeDraft.get(t.id) ||
    scope.querySelector(`[data-handoff-outcome="${t.id}"]:checked`)?.value || "";
  for (const radio of scope.querySelectorAll(`[data-handoff-outcome="${t.id}"]`))
    radio.checked = radio.value === outcome;
  const receiptWrap = scope.querySelector(`[data-receipt-wrap="${t.id}"]`);
  const receipt = scope.querySelector(`[data-handoff-receipt="${t.id}"]`);
  if (receiptWrap) receiptWrap.hidden = !executedApply;
  if (receipt && receipt.value !== (receiptDraft.get(t.id) || ""))
    receipt.value = receiptDraft.get(t.id) || "";
  const hasOutcome = !executedApply || Boolean(outcome);
  const hasReceipt = !executedApply || Boolean((receipt?.value || "").trim());
  const b = scope.querySelector(`[data-decide="${t.id}"]`);
  if (b){
    b.disabled = !opt || !hasOutcome || !hasReceipt;
    b.textContent = !opt ? "先选择 A / B / C"
      : incompleteApply ? `按 ${opt.key} 方向 · 交回 Agent 补齐文件`
      : executedApply && !hasOutcome ? `先选择 ${opt.key} 的执行结果`
      : executedApply && !hasReceipt ? `先填写 ${opt.key} 的执行回执`
      : executedApply && outcome === "failure" ? `确认 ${opt.key} · 已尝试执行但失败`
      : executedApply ? `确认 ${opt.key} · 执行成功并附回执`
      : `采用 ${opt.key} · 交回原 Agent`;
  }
  const h = scope.querySelector("[data-hoh]");
  if (h) h.textContent = !opt ? "先阅读摘要、做法和代价,再选择一个方案。"
    : incompleteApply
      ? "确认后不会应用或归档任何文件:只会锁定这个方案方向,并交回原 Agent 补齐缺失文件。"
    : executedApply
      ? outcome === "failure"
        ? "本次会记录为已尝试执行但失败:保留错误回执、把本轮文件归档到 handoff 目标,并交回原 Agent 修正;不会冒充已应用。"
        : outcome === "success"
          ? "本次会记录为执行成功:保留回执、把文件归档到 handoff 目标,并交回原 Agent 做结果验证。"
          : "先取走并自行应用上面的文件,再明确选择成功或失败并填写原始回执。"
      : "确认后不会结案:选择与补充指示会原样交回原 Agent 继续。";
}

function upsert(t, wanted){
  wanted.add(t.id);
  const { html, cls } = cardParts(t);
  let el = cardNodes.get(t.id);
  if (el && el.dataset.leaving){ el.remove(); el = null; }   // never reuse a departing ghost
  const fresh = !el;
  if (fresh){
    el = document.createElement("div");
    el.dataset.id = t.id;
    cardNodes.set(t.id, el);
  }
  // ⚠ Overwriting className raw strips mid-flight flip/enter classes. SSE arrives
  //   right after actions, so renders ALWAYS overlap animations (measured: correct
  //   inversion values, class stripped, cards teleporting).
  const keep = ["flip", "enter"].filter((k) => el.classList.contains(k));
  el.className = keep.length ? cls + " " + keep.join(" ") : cls;
  if (el.__sig !== html){
    el.innerHTML = html;
    el.__sig = html;
    // Drafts live OUTSIDE the signature; poured back only when the node is rebuilt.
    const vin = el.querySelector("[data-vin]");
    if (vin) vin.value = verdictDraft.get(t.id) || "";
    syncHandoff(el);
  }
  if (fresh && !REDUCED.matches) el.classList.add("enter");
  return el;
}

/** Converge to the wanted order with minimal moves; correctly-placed nodes stay. */
function placeList(list, nodes){
  let ref = list.firstChild;
  for (const node of nodes){
    if (ref === node){ ref = ref.nextSibling; continue; }
    list.insertBefore(node, ref);
  }
  while (ref){                       // strip leftovers (empty/divider etc.)
    const next = ref.nextSibling;
    if (!(ref instanceof Element && ref.classList.contains("card"))) ref.remove();
    ref = next;
  }
}

// ⭐ Never render twice in one frame. SSE right after refresh() is the NORM; without
//   folding, the second pass snapshots "already moved" as FIRST and erases the
//   first inversion (measured as teleporting cards). One render is also cheaper.
let renderQueued = false;
/** The "continue an earlier goal" options follow the board (done goals keep
 *  growing). Rebuilt only when the set changes — never interrupts a selection. */
function syncGoalPrev(){
  const sel = document.getElementById("goal-prev");
  if (!sel) return;
  const dones = tasks.filter((t) => t.kind === "goal" && t.status === "done").sort((a, b) => b.id - a.id);
  const sig = dones.map((d) => d.id).join(",");
  if (sel.__sig === sig) return;
  sel.__sig = sig;
  const cur = sel.value;
  sel.innerHTML = `<option value="">(不衔接既往目标)</option>` +
    dones.map((d) => `<option value="${d.id}">衔接 #${d.id} ${esc(String(d.subject).slice(0, 22))}</option>`).join("");
  sel.value = cur;
}

/* ── Timeline (two views: lineage = default / load) ─────────────────────
   Ruling: the old single view stacked real-time × lines × waiting bands ×
   relation edges and read like nothing. Split in two:
   ① Lineage (default): vertical = parent/child topology with auto lane
      allocation (lines only COLOR nodes — moving lines never rewrites history).
      Horizontal = EVENT ORDER, equidistant (real time crushes second-long work
      spans at day scale — times live in node titles).
      Derivation = ╲  merge = ╱ (COMPLETED cards only). Waiting = hollow circle.
   ② Load: per-line work segments + waiting-count bands + start clusters.
      Carries NO lineage (edges removed) + explicit cross-day labels. */
const TL = { PXH: 56, ROWH: 34, BANDH: 10, AXH: 22, LABW: 96, STEP: 26, LROW: 20 };
let tlDate = null;
let tlMode = "lineage";
let tlView = "fit";          // load-view window: "fit" | "day" | {from,to} = cluster zoom
function tlDayStr(d){ const p=(n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
const fmtMD = (ms) => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtHM = (ms) => { const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
// Cross-day ranges name both dates ("23:00–1:00" otherwise reads as two hours)
const fmtRange = (a, b) => fmtMD(a) === fmtMD(b)
  ? `${fmtMD(a)} ${fmtHM(a)}–${fmtHM(b)}`
  : `${fmtMD(a)} ${fmtHM(a)}–${fmtMD(b)} ${fmtHM(b)}`;

function renderTimeline(){
  const wrap = document.getElementById("tl-scroll");
  if (!document.getElementById("tl").classList.contains("open")) return;
  if (!tlDate) tlDate = tlDayStr(new Date());
  const dp = document.getElementById("tl-date");
  if (dp.value !== tlDate) dp.value = tlDate;
  document.getElementById("tl-mode-lin").classList.toggle("pri", tlMode === "lineage");
  document.getElementById("tl-mode-load").classList.toggle("pri", tlMode === "load");
  for (const idb of ["tl-fit", "tl-day"])
    document.getElementById(idb).style.display = tlMode === "load" ? "" : "none";
  if (tlMode === "lineage") return renderLineage(wrap);
  document.getElementById("tl-fit").classList.toggle("pri", tlView === "fit");
  document.getElementById("tl-day").classList.toggle("pri", tlView === "day");
  renderLoad(wrap);
}

/* ── ① Lineage view: horizontal = event order (git-like, non-proportional),
      vertical = active branches (lanes reclaimed on completion) ──
   Standing rulings:
   - out-of-window ancestors = ONE "from before" entry node (history stays out of
     the coordinate system)
   - lanes occupy only while active; reclaimed and reused when done
   - no proportional time scale (mixing it with equidistant events misleads);
     times = node titles + small change-of-hour labels
   - focus = a TRUE re-layout (the family alone)
   - grouped per goal; other groups fold to a summary row */
let tlOpenGroups = null;   // Set of open group keys; null = first render (open the busiest)
function renderLineage(wrap){
  const P = Date.parse, now2 = Date.now();
  const day0 = new Date(tlDate + "T00:00:00").getTime();
  const d0 = day0 - 3600_000, d1 = day0 + 25 * 3600_000;
  const byId = new Map(tasks.filter((t) => !t.archived_at).map((t) => [t.id, t]));
  const focusing = focusId != null && relSet.size > 0;

  // ⭐ The history comes from the IMMUTABLE RECORD, not from the card's current
  //   values. Deriving it from created_at / work_spans / status meant a card moved to
  //   another line today made yesterday's work look like it happened on the new line;
  //   a re-hang rerouted the whole family tree backwards.
  const evsByTask = new Map();
  for (const e of taskEvents){
    if (!evsByTask.has(e.task_id)) evsByTask.set(e.task_id, []);
    evsByTask.get(e.task_id).push(e);
  }
  /** One recorded event → what the timeline draws. `release` carries two different
   *  meanings and is told apart by its detail (an in-flight card coming back is the
   *  end of a work span; a hold/release of the flag is not). */
  const visualKind = (e) => {
    if (e.kind === "snapshot" || e.kind === "add") return "birth";
    if (e.kind === "claim") return "open";
    if (e.kind === "report") return "close";
    if (e.kind === "reap") return "close";
    if (e.kind === "resolve" && e.detail.status === "done") return "done";
    if (e.kind === "release" && e.detail.from_status === "in_progress") return "close";
    return e.kind;
  };
  // Raw events → keep ONLY the window's (out-of-window history stays out)
  const winEvsOf = (t) => {
    const src = evsByTask.get(t.id) || [];
    const raw = src.map((e) => ({ k: visualKind(e), at: P(e.at), w: e.actor, ev: e }))
                   .filter((e) => Number.isFinite(e.at));
    // A board migrated before this table existed has one snapshot and nothing else;
    // fall back to the birth marker so such a card still appears at all.
    if (!raw.length) raw.push({ k: "birth", at: P(t.created_at) });
    raw.sort((a, b) => a.at - b.at);
    if (t.status !== "done" && (t.work_spans || []).some((sp) => !sp.e))
      raw.push({ k: "now", at: now2 });
    return { win: raw.filter((e) => e.at >= d0 && e.at < d1), pre: raw[0].at < d0 };
  };
  /** The parent this card had AS OF THE END OF THE DISPLAYED WINDOW, from the record.
   *  Reading the current parent_id would redraw an old day's tree with today's shape.
   *  ⚠ Known remaining gap: a card re-hung mid-history is drawn under one parent per
   *  day, not as one family spanning both — see the ledger entry for #97's second half
   *  (the union-of-historical-links grouping the origin does). */
  const parentAt = (id) => {
    const src = evsByTask.get(id) || [];
    for (let i = src.length - 1; i >= 0; i--){
      const e = src[i];
      if (P(e.at) > d1) continue;                     // not yet true within this window
      if (e.detail?.parent_id !== undefined) return e.detail.parent_id == null ? null : Number(e.detail.parent_id);
    }
    return byId.get(id)?.parent_id ?? null;
  };

  // Participants: cards with in-window events (focus = the family only, a true
  // re-layout) + ancestors (entry nodes only)
  const inc = new Map();
  for (const t of byId.values()){
    if (focusing && !relSet.has(t.id)) continue;
    const { win, pre } = winEvsOf(t);
    if (win.length) inc.set(t.id, { t, win, pre });
  }
  const addAnc = (id) => { const t = id != null ? byId.get(id) : null;
    if (!t || inc.has(t.id)) return;
    if (focusing && !relSet.has(t.id)) return;
    const { win, pre } = winEvsOf(t);
    inc.set(t.id, { t, win, pre });
    addAnc(parentAt(t.id)); };
  for (const { t } of [...inc.values()]) addAnc(parentAt(t.id));

  if (!inc.size){ wrap.innerHTML = `<div class="empty">这一天没有事件</div>`;
    document.getElementById("tl-sum").textContent = "";
    document.getElementById("tl-note").textContent = ""; return; }

  const kids = new Map();
  for (const { t } of inc.values()){
    const pid = parentAt(t.id);
    if (pid != null && inc.has(pid)){
      if (!kids.has(pid)) kids.set(pid, []);
      kids.get(pid).push(t.id);
    }
  }
  // First-drawn time (= entry node placement). Pre-window/eventless ancestors get
  // one entry node just before min(own first in-window event, children's first draw).
  const fdMemo = new Map();
  const firstDrawnAt = (id) => {
    if (fdMemo.has(id)) return fdMemo.get(id);
    const r = inc.get(id);
    let v = r.win.length ? r.win[0].at : Infinity;
    for (const c of kids.get(id) || []) v = Math.min(v, firstDrawnAt(c));
    if (r.pre || !r.win.length) v = v - 1;
    fdMemo.set(id, v); return v;
  };
  for (const [id, r] of inc){
    r.evs = [...r.win];
    if (r.pre || !r.win.length) r.evs.unshift({ k: "entry", at: firstDrawnAt(id) });
  }

  // Grouping: goal-rooted → that group / goalless roots → one "loose" group
  const rootOf = (id) => { let cur = id, guard = 0;
    while (guard++ < 99){ const pp = parentAt(cur);
      if (pp == null || !inc.has(pp)) return cur; cur = pp; }
    return cur; };
  const groups = new Map();
  for (const id of inc.keys()){
    const rid = rootOf(id), rt = inc.get(rid).t;
    const key = rt.kind === "goal" ? String(rid) : "misc";
    if (!groups.has(key)) groups.set(key, { key, root: rt.kind === "goal" ? rt : null, members: [] });
    groups.get(key).members.push(id);
  }
  const gArr = [...groups.values()];
  for (const g of gArr)
    g.nev = g.members.reduce((a, m) => a + inc.get(m).evs.filter((e) => e.k !== "entry").length, 0);
  gArr.sort((a, b) => b.nev - a.nev);
  if (tlOpenGroups == null) tlOpenGroups = new Set(gArr.length ? [gArr[0].key] : []);

  // How far (in time) a card needs its lane as a PARENT (children's junctions)
  const asParentEnd = new Map();
  for (const [id, r] of inc){
    const pid = r.t.parent_id;
    if (pid == null || !inc.has(pid)) continue;
    const f = firstDrawnAt(id);
    const doneEv = r.t.status === "done" ? r.evs.find((e) => e.k === "done") : null;
    asParentEnd.set(pid, Math.max(asParentEnd.get(pid) || -Infinity, f, doneEv ? doneEv.at : f));
  }

  const CSTEP = 24, LROW = 20, HEADH = 22, GX0 = 74;
  const colorOf = (t) => t.kind === "goal" ? "#c084fc" : lineColor(t.line);
  const esc2 = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const NLC = String.fromCharCode(10);

  // ── pass 1: per-group columns (event order, equidistant) and lanes (reclaimed) ──
  let y = 6, ncolMax = 1, evTotal = 0, tMin = Infinity, tMax = -Infinity;
  for (const g of gArr){
    g.open = focusing || tlOpenGroups.has(g.key);
    g.headY = y; y += HEADH;
    if (!g.open) { y += 4; continue; }
    g.rows = g.members.flatMap((m) => inc.get(m).evs.map((ev) => ({ id: m, ev })))
      .sort((a, b) => a.ev.at - b.ev.at);
    g.colX = new Map();
    let ci = 0;
    for (const rw of g.rows){ g.colX.set(rw.ev, GX0 + ci * CSTEP); ci++; }
    g.ncols = ci; ncolMax = Math.max(ncolMax, ci);
    for (const rw of g.rows) if (rw.ev.k !== "entry"){
      evTotal++; tMin = Math.min(tMin, rw.ev.at); tMax = Math.max(tMax, rw.ev.at); }
    // Lane reclaim: sweep active spans [firstDrawn, max(own last event, child
    // junctions)]; freed lanes are reused
    const spans = g.members.map((m) => {
      const r = inc.get(m), s0 = firstDrawnAt(m);
      let e0 = r.evs.length ? r.evs[r.evs.length - 1].at : s0;
      e0 = Math.max(e0, asParentEnd.get(m) ?? -Infinity);
      return { m, s0, e0 };
    }).sort((a, b) => a.s0 - b.s0 || a.e0 - b.e0);
    g.laneOf = new Map();
    const laneFree = [];
    for (const sp of spans){
      let ln = laneFree.findIndex((f) => f < sp.s0);
      if (ln === -1){ ln = laneFree.length; laneFree.push(-Infinity); }
      laneFree[ln] = sp.e0; g.laneOf.set(sp.m, ln);
    }
    g.lanes = laneFree.length;
    g.y0 = y + 4; y = g.y0 + g.lanes * LROW + 10;
  }
  const W = Math.max(720, GX0 + ncolMax * CSTEP + 50), H = y + 6;

  // ── pass 2: draw ─────────────────────────────────────────────────────
  let svg = "";
  for (const g of gArr){
    const root = g.root, gc = root ? colorOf(root) : "#5d6472";
    const glab = root ? `目标#${root.id} ${esc2(String(root.subject).slice(0, 30))}` : "散卡(无目标)";
    svg += `<g class="tl-ghead" data-tlgroup="${g.key}">` +
      `<rect x="2" y="${g.headY}" width="${W - 4}" height="${HEADH - 4}" fill="${gc}" opacity=".07" rx="4"/>` +
      `<text x="8" y="${g.headY + 13}" fill="${gc}">${g.open ? "▾" : "▸"} ${glab} · ${g.members.length} 张 · ${g.nev} 事件</text>` +
      `<title>${g.open ? "点击折叠" : "点击展开"}</title></g>`;
    if (!g.open) continue;
    const X = (ev) => g.colX.get(ev);
    const Y = (m) => g.y0 + g.laneOf.get(m) * LROW + 10;

    // Small labels only at hour changes (not a proportional scale — positions stay
    // the event columns)
    let prevHK = "", lastLabX = -1e9;
    for (const rw of g.rows){
      if (rw.ev.k === "entry") continue;
      const d = new Date(rw.ev.at), dayk = fmtMD(rw.ev.at), hk = dayk + "#" + d.getHours();
      if (hk === prevHK) continue;
      const first = prevHK === ""; prevHK = hk;
      const x = X(rw.ev);
      if (x - lastLabX < 40) continue;
      lastLabX = x;
      svg += `<text class="tl-ticklab" x="${x}" y="${g.y0 - 1}" text-anchor="middle">${first || d.getHours() === 0 ? dayk + " " : ""}${fmtHM(rw.ev.at)}</text>`;
    }
    // Edges first (nodes go on top). Both ends are visible nodes (parents get a
    // junction dot).
    for (const m of g.members){
      const r = inc.get(m), pid = r.t.parent_id;
      if (pid == null || !inc.has(pid) || !g.laneOf.has(pid)) continue;
      const py = Y(pid), cy2 = Y(m), pc = colorOf(inc.get(pid).t);
      const bEv = r.evs[0], bx = X(bEv);
      svg += `<circle cx="${bx - 9}" cy="${py}" r="2.2" fill="${pc}" opacity=".9"/>` +
        `<path class="tl-edge" d="M ${bx - 9} ${py} Q ${bx} ${py} ${bx} ${cy2}"/>`;
      if (r.t.status === "done"){
        const dEv = r.evs.find((e) => e.k === "done");
        if (dEv){ const dx2 = X(dEv);
          svg += `<circle cx="${dx2 + 9}" cy="${py}" r="2.2" fill="${pc}" opacity=".9"/>` +
            `<path class="tl-edge merge" d="M ${dx2} ${cy2} Q ${dx2} ${py} ${dx2 + 9} ${py}"/>`; }
      }
    }
    // Lanes + nodes per card. A lane spans only its own nodes ∪ junctions — never
    // to the right edge.
    for (const m of g.members){
      const r = inc.get(m), t = r.t, c = colorOf(t), yy = Y(m);
      const xs = r.evs.map((e) => X(e));
      let x0 = Math.min(...xs), x1 = Math.max(...xs);
      for (const cid of kids.get(m) || []){
        const cr = inc.get(cid);
        if (!g.colX.has(cr.evs[0])) continue;
        x0 = Math.min(x0, X(cr.evs[0]) - 9);
        const dEv = cr.t.status === "done" ? cr.evs.find((e) => e.k === "done") : null;
        if (dEv) x1 = Math.max(x1, X(dEv) + 9);
      }
      let gg = `<text class="tl-ticklab" x="${x0 - 6}" y="${yy + 3}" text-anchor="end" fill="${c}">#${t.id}</text>`;
      if (x1 > x0)
        gg += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" stroke="${c}" stroke-width="${t.kind === "goal" ? 2.4 : 1.3}" opacity="${t.kind === "goal" ? ".55" : ".4"}"/>`;
      for (let i2 = 0; i2 < r.evs.length; i2++){        // work spans = thick segments (open→close/now)
        if (r.evs[i2].k !== "open") continue;
        const nxt = r.evs.slice(i2 + 1).find((e) => e.k === "close" || e.k === "now");
        if (nxt) gg += `<line x1="${X(r.evs[i2])}" y1="${yy}" x2="${X(nxt)}" y2="${yy}" stroke="${c}" stroke-width="4.5" stroke-linecap="round" opacity=".95"/>`;
      }
      r.evs.forEach((e, i2) => {
        const x = X(e), tt = `${fmtMD(e.at)} ${fmtHM(e.at)}`, last = i2 === r.evs.length - 1;
        if (e.k === "entry")
          gg += `<circle cx="${x}" cy="${yy}" r="3.4" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 2"><title>#${t.id} 来自此前(窗口外历史未导入)${NLC}${esc2(t.subject)}</title></circle>`;
        else if (e.k === "birth")
          gg += `<circle cx="${x}" cy="${yy}" r="3.4" fill="${c}"><title>#${t.id} 启动 ${tt}${NLC}${esc2(t.subject)}</title></circle>`;
        else if (e.k === "open")
          gg += `<rect x="${x - 2.6}" y="${yy - 2.6}" width="5.2" height="5.2" fill="${c}"><title>#${t.id} 开工 ${tt} · ${esc2(lineLabel(e.w))}</title></rect>`;
        else if (e.k === "close"){
          if (last && t.status === "waiting")
            gg += `<circle cx="${x}" cy="${yy}" r="4" fill="var(--panel)" stroke="${c}" stroke-width="1.8"><title>#${t.id} 交付→等待${t.waiting_for ? "/" + esc2(WF_LABEL[t.waiting_for] || t.waiting_for) : ""} ${tt}</title></circle>`;
          else
            gg += `<circle cx="${x}" cy="${yy}" r="2.6" fill="${c}"><title>#${t.id} 收段 ${tt}</title></circle>`;
        } else if (e.k === "done")
          gg += `<circle cx="${x}" cy="${yy}" r="3.6" fill="${c}"><title>#${t.id} 完成 ${tt}</title></circle>`;
        else if (e.k === "now")
          gg += `<circle cx="${x}" cy="${yy}" r="3" fill="${c}" opacity=".5"><title>#${t.id} 进行中(现在)</title></circle>`;
      });
      if (t.status === "waiting" && r.evs[r.evs.length - 1].k === "birth")
        gg += `<circle cx="${X(r.evs[r.evs.length - 1])}" cy="${yy}" r="5" fill="none" stroke="${c}" stroke-width="1.6"><title>#${t.id} 等待中(未经处理)</title></circle>`;
      svg += `<g class="tl-seg${focusId === t.id ? " sel" : ""}" data-tlid="${t.id}">` +
        `<title>#${t.id} ${esc2(t.subject)}${NLC}${esc2(lineLabel(t.line))} · ${esc2(t.status)}</title>${gg}</g>`;
    }
  }
  wrap.innerHTML = `<svg id="tl-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
  const rangeLab = evTotal ? fmtRange(tMin, tMax) : "";
  document.getElementById("tl-sum").textContent =
    (focusing ? `谱系·聚焦 #${focusId} 家族 · ` : `谱系 · `) +
    `${gArr.length} 组 · ${inc.size} 张 · ${evTotal} 事件${rangeLab ? " · " + rangeLab : ""}`;
  document.getElementById("tl-note").textContent = focusing
    ? `聚焦中: 只画 #${focusId} 家族(再点该卡节点=恢复全图)`
    : `横=事件顺序(时刻见悬浮/时变小字) 纵=活跃分支(完成即回收轨道) ╮派生 ╯合流(仅完成) ●启动 ■开工 ○等待 ◌来自此前 · 点组行折叠/展开 · 点节点=只留该家族`;
}
document.addEventListener("click", (e) => {
  const gh = e.target.closest("[data-tlgroup]");
  if (gh && tlOpenGroups){
    const k = gh.dataset.tlgroup;
    if (tlOpenGroups.has(k)) tlOpenGroups.delete(k); else tlOpenGroups.add(k);
    renderTimeline();
